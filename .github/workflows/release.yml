# Builds the Windows installer on GitHub's Windows machines whenever a
# release tag (v1.2.3, or a beta like v1.2.3-beta.1) is pushed, checks it, and attaches it to the GitHub
# release with the packaged plugin and SHA256SUMS.txt. The kit's updater
# verifies the checksum before running anything.
#
# Every action is pinned to a commit SHA (the tag it came from is in the
# comment), so a moved tag upstream can't change what runs here.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: What's new is written down for this version (CHANGELOG.md)
        run: |
          v="${GITHUB_REF_NAME#v}"; v="${v%%-*}"     # v0.2.0-beta.1 and v0.2.0 share the 0.2.0 section
          grep -qxF "## $v" CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: 'pip install --require-hashes --only-binary=:all: -r installer/requirements-ci.txt'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
      - name: Kit tests as each made-up test person (includes the leak test)
        run: |
          cd app/agent
          for person in priya-healthtech-pm dana-retail-analytics marcus-customer-success; do
            echo "::group::Tests as $person"
            KIT_SETTINGS_DIR=../../examples/$person/settings python agent_tests/run_all.py
            echo "::endgroup::"
          done
      - run: 'pip install --require-hashes --only-binary=:all: -r installer/requirements-security.txt'
      - name: No known vulnerabilities in the installer's packages, and its bill of materials
        run: |
          bandit -q -r app -x app/agent/agent_tests -ll
          pip-audit --disable-pip --no-deps -r installer/requirements-windows.txt -f cyclonedx-json -o job-search-kit-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: job-search-kit-sbom.cdx.json }

  windows-installer:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the installer (pinned Python and packages, checksums)
        shell: pwsh
        run: ./installer/build_windows.ps1 -Version "${{ github.ref_name }}"
      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate | Out-Null
          & $mp -Scan -ScanType 3 -File "$PWD\dist" -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender reported a problem (exit $LASTEXITCODE)" }
      - name: Scan with VirusTotal (when a VT_API_KEY secret is set)
        if: env.VT_API_KEY != ''
        shell: pwsh
        run: |
          # Files over 32 MB (the installer is) need a one-time upload URL.
          # The free API allows 4 requests a minute, so polls are 20 s apart.
          # Any missing answer fails the step: a scan that didn't happen
          # must never read as a clean scan.
          $exe = Get-ChildItem dist -Filter "JobSearchKit-Setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "no installer in dist" }
          $hdr = @{ "x-apikey" = $env:VT_API_KEY }
          $upload = (Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Headers $hdr).data
          if (-not $upload) { throw "VirusTotal gave no upload URL (check the VT_API_KEY secret)" }
          $r = curl.exe -s -X POST $upload -H "x-apikey: $env:VT_API_KEY" -F "file=@$($exe.FullName)" | ConvertFrom-Json
          $id = $r.data.id
          if (-not $id) { throw "VirusTotal upload failed: $($r.error.message)" }
          $a = $null
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep 20
            $a = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$id" -Headers $hdr
            if ($a.data.attributes.status -eq "completed") { break }
          }
          if ($a.data.attributes.status -ne "completed") { throw "VirusTotal didn't finish within 15 minutes" }
          $s = $a.data.attributes.stats
          Write-Host "VirusTotal: malicious=$($s.malicious) suspicious=$($s.suspicious) undetected=$($s.undetected)"
          $flagged = @($a.data.attributes.results.PSObject.Properties | Where-Object { $_.Value.category -eq "malicious" } | ForEach-Object { $_.Name })
          if ($flagged) { Write-Host "Flagged by: $($flagged -join ', ')" }
          # What each one called it, and where the full report is: both are
          # needed for a false-positive report.
          foreach ($e in $a.data.attributes.results.PSObject.Properties) {
            if ($e.Value.category -eq "malicious") { Write-Host "  $($e.Name): $($e.Value.result)" }
          }
          Write-Host "Report: https://www.virustotal.com/gui/file/$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())"
          # Microsoft's verdict is what Windows users get, so it alone stops the
          # release. Other engines' machine-learning guesses often hit new,
          # unsigned installers, so it takes three of them to stop it.
          if ($flagged -contains "Microsoft") { throw "Microsoft flagged the installer; submit it as a false positive before releasing" }
          if ($flagged.Count -ge 3) { throw "VirusTotal: $($flagged.Count) engines flagged the installer" }
      # A scan that stops the release still keeps the installer on this run's
      # page, so the maintainer can send that exact file to Microsoft as a
      # false positive. Nothing downstream reads it: clean-install and publish
      # only run when this job passes, and only ever take "dist".
      - name: Keep the installer a scan stopped (for a false-positive report)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stopped-installer
          path: dist/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  clean-install:
    # A fresh Windows machine every run: install silently, check the Start menu
    # items and the folder step, run the agent once, uninstall.
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist }
      - name: Install silently and check (same script the pull request check runs)
        shell: pwsh
        run: ./installer/smoke_test_windows.ps1 -Dist dist

  publish:
    # The "release" environment holds this job until the maintainer approves it
    # on GitHub (Settings, Environments, release, Required reviewers).
    needs: clean-install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: sbom, path: dist }
      - name: Attach to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Shown at the top of the release page, above the list of changes.
          body: |
            **To install on Windows:** download `JobSearchKit-Setup.exe` from Assets below and open it. [Step-by-step instructions](https://github.com/nicolelivingston/job-search-kit#install-on-windows).

            Already have the kit? It updates itself to each full release (never to a beta), unless you turned that off.

            What's new, in plain words: [CHANGELOG.md](https://github.com/nicolelivingston/job-search-kit/blob/main/CHANGELOG.md).

            The other files: `job-search-kit.plugin` is the Claude plugin, and the rest are checks the kit's updater uses.
          files: |
            dist/JobSearchKit-Setup.exe
            dist/job-search-kit.plugin
            dist/SHA256SUMS.txt
            dist/job-search-kit-sbom.cdx.json
          generate_release_notes: true
          # A tag with a dash (v0.2.0-beta.1) is a beta: published as a
          # pre-release, which kits' automatic updates never see. Only a plain
          # tag (v0.2.0) reaches users.
          prerelease: ${{ contains(github.ref_name, '-') }}
