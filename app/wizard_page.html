<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Kit</title>
<style>
:root{--bg:#f5f4f1;--surface:#ffffff;--surface2:#faf9f6;--group:#f3f1ec;--col:#ecebe6;--note:#f7f5f0;--chip:#f1efea;--text:#1f2328;--text2:#3a3f46;--text3:#4a4f57;--muted:#5b616b;--line:#e4e1da;--line2:#d6d2c9;--line3:#efece6;--accent:#2f5d8a;--accent-soft:#e9eff6;--accent-text:#1f4467;--sel:#eef3f9;--on-accent:#ffffff;--good:#1e5631;--bad:#8a1c14;--fit-bg-s:75%;--fit-bg-l:86%;--fit-fg-s:70%;--fit-fg-l:22%;--p-gray-bg:#eeeeee;--p-gray-fg:#3f444b;--p-blue-bg:#dfeaf7;--p-blue-fg:#1f4467;--p-teal-bg:#d8f0ec;--p-teal-fg:#0f5148;--p-green-bg:#e0f0e3;--p-green-fg:#1e5631;--p-yellow-bg:#fbf1c7;--p-yellow-fg:#5c4a00;--p-orange-bg:#fde3cc;--p-orange-fg:#7a3a00;--p-red-bg:#fadcd9;--p-red-fg:#8a1c14;--p-purple-bg:#ebe2f7;--p-purple-fg:#4b2a7a;--p-pink-bg:#f9dfeb;--p-pink-fg:#7d1d4d;--warn:#7a3a00;color-scheme:light}
:root[data-theme=dark]{--bg:#141517;--surface:#1d1f22;--surface2:#23262a;--group:#262a2e;--col:#191b1e;--note:#262a2e;--chip:#2c3035;--text:#e8e6e1;--text2:#c9c6bf;--text3:#b5b2ab;--muted:#a19e97;--line:#33373c;--line2:#43484e;--line3:#2a2e33;--accent:#3d6fa3;--accent-soft:#22324a;--accent-text:#9cc3ec;--sel:#1f2b3a;--on-accent:#ffffff;--good:#8fd19e;--bad:#f2a39b;--fit-bg-s:45%;--fit-bg-l:26%;--fit-fg-s:70%;--fit-fg-l:82%;--p-gray-bg:#33373c;--p-gray-fg:#d7d5d0;--p-blue-bg:#1f3550;--p-blue-fg:#a9cbef;--p-teal-bg:#143c37;--p-teal-fg:#8fdacb;--p-green-bg:#1b3a24;--p-green-fg:#9fd8ab;--p-yellow-bg:#3d3412;--p-yellow-fg:#ecd98a;--p-orange-bg:#45290f;--p-orange-fg:#f3b98a;--p-red-bg:#4a1d1a;--p-red-fg:#f2a7a0;--p-purple-bg:#34264a;--p-purple-fg:#cdb6f0;--p-pink-bg:#47203a;--p-pink-fg:#f0aed0;--warn:#f3b98a;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#141517;--surface:#1d1f22;--surface2:#23262a;--group:#262a2e;--col:#191b1e;--note:#262a2e;--chip:#2c3035;--text:#e8e6e1;--text2:#c9c6bf;--text3:#b5b2ab;--muted:#a19e97;--line:#33373c;--line2:#43484e;--line3:#2a2e33;--accent:#3d6fa3;--accent-soft:#22324a;--accent-text:#9cc3ec;--sel:#1f2b3a;--on-accent:#ffffff;--good:#8fd19e;--bad:#f2a39b;--fit-bg-s:45%;--fit-bg-l:26%;--fit-fg-s:70%;--fit-fg-l:82%;--p-gray-bg:#33373c;--p-gray-fg:#d7d5d0;--p-blue-bg:#1f3550;--p-blue-fg:#a9cbef;--p-teal-bg:#143c37;--p-teal-fg:#8fdacb;--p-green-bg:#1b3a24;--p-green-fg:#9fd8ab;--p-yellow-bg:#3d3412;--p-yellow-fg:#ecd98a;--p-orange-bg:#45290f;--p-orange-fg:#f3b98a;--p-red-bg:#4a1d1a;--p-red-fg:#f2a7a0;--p-purple-bg:#34264a;--p-purple-fg:#cdb6f0;--p-pink-bg:#47203a;--p-pink-fg:#f0aed0;--warn:#f3b98a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Inter,sans-serif}
a{color:var(--accent-text)}a:hover{color:var(--accent)}
button,input,select,textarea{color:inherit;font:inherit}
.sr{position:absolute;left:-9999px}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin:0}
.beta{font-size:11px;font-weight:600;border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
nav a{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--text)}
nav a.on{font-weight:600;background:var(--accent-soft);color:var(--accent-text)}
nav select{width:auto;min-height:0;height:36px;padding:0 8px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:13px;cursor:pointer}
main{max-width:1440px;margin:0 auto;padding:20px 24px 48px}
main.narrow{max-width:980px}
h1{margin:0 0 6px;font-size:24px}h2{font-size:18px;margin:0 0 6px}h3{font-size:14px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
label{display:block;font-weight:600;margin:14px 0 4px}.hint{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.two label{margin-top:0}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.choice label{display:flex;gap:8px;align-items:center;font-weight:400;margin:0;min-height:40px;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;background:var(--surface)}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input,input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}.check input{margin-top:2px;flex:0 0 auto}
button{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);cursor:pointer}
button.primary,a.primary{border:0;background:var(--accent);color:var(--on-accent);font-weight:600}
a.btn{display:inline-flex;align-items:center;height:38px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;text-decoration:none;color:var(--text)}
a.btn.primary{border:0;color:var(--on-accent)}
button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.steps button{height:32px;padding:0 10px;font-size:13px}
.bar{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.note{padding:10px 12px;border-radius:8px;background:var(--note);margin:12px 0}.banner{border-left:4px solid var(--warn)}
.ok{color:var(--good)}.err{color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line3);vertical-align:top}
th{font-size:12px;color:var(--text3);font-weight:600}.scroll{overflow-x:auto}
.dom{display:grid;grid-template-columns:1.2fr .8fr 2fr auto;gap:8px;margin-bottom:8px;align-items:center}
/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tools>div{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{width:260px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;height:36px}
/* grid tables */
.grid{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.grid .gr{display:grid;align-items:center;border-bottom:1px solid var(--line3);background:var(--surface)}
.grid .gh{background:var(--surface2);border-bottom:1px solid var(--line)}
.grid .gh button{width:100%;min-height:36px;display:flex;gap:6px;align-items:center;background:none;border:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);text-align:left;padding:0 8px}
.grid .gr.gh>div{padding:4px 6px;overflow-wrap:normal}
.grid .gr>div{padding:10px 14px;min-width:0;overflow-wrap:anywhere}
.grid .gr.sel{background:var(--sel)}
.grid .group{border-bottom:1px solid var(--line);background:var(--group)}
.grid .group button{display:flex;gap:10px;align-items:center;width:100%;min-height:40px;padding:0 14px;border:0;background:none;font-weight:600;text-align:left}
.grid .group .m{color:var(--muted);font-weight:400;font-size:12px}
.grid .cols-apps{grid-template-columns:270px 240px 150px 76px 100px 100px 86px 160px 110px 60px;min-width:1352px}
.grid .cols-cos{grid-template-columns:240px 150px 140px 170px 110px 130px 150px 160px 130px 110px 180px 200px 170px 100px 130px 120px 110px 220px 240px 240px;min-width:3370px;align-items:start;font-size:13px;line-height:1.45}
.grid .cols-cos>div:first-child{position:sticky;left:0;z-index:1;background:inherit;border-right:1px solid var(--line3);display:flex;gap:6px;align-items:center}
.grid .gh.cols-cos>div:first-child{z-index:2}
.grid .gr>div.edit{padding:4px 6px}
.ib{flex:0 0 auto;width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.eb{width:40px;height:36px;padding:0;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.role{font-weight:600}.muted{color:var(--muted)}.green{color:var(--good)}.red{color:var(--bad)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.fit{display:inline-block;min-width:34px;text-align:center;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}
.newtag{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600}
.p-gray{background:var(--p-gray-bg);color:var(--p-gray-fg)}.p-blue{background:var(--p-blue-bg);color:var(--p-blue-fg)}.p-teal{background:var(--p-teal-bg);color:var(--p-teal-fg)}
.p-green{background:var(--p-green-bg);color:var(--p-green-fg)}.p-yellow{background:var(--p-yellow-bg);color:var(--p-yellow-fg)}.p-orange{background:var(--p-orange-bg);color:var(--p-orange-fg)}
.p-red{background:var(--p-red-bg);color:var(--p-red-fg)}.p-purple{background:var(--p-purple-bg);color:var(--p-purple-fg)}.p-pink{background:var(--p-pink-bg);color:var(--p-pink-fg)}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.board .col{flex:0 0 220px;background:var(--col);border-radius:12px;padding:10px}
.board .ch{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px}
.board .cards{display:flex;flex-direction:column;gap:8px}
.board .cards button{display:block;width:100%;height:auto;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.board .cards b{display:block;margin-bottom:4px}.board .cards span.co{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
/* drawer */
.backdrop{position:fixed;inset:0;z-index:20;border:0;padding:0;border-radius:0;height:auto;background:rgba(10,10,12,.18);cursor:default}
.drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(20,20,20,.08);overflow-y:auto;padding:20px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.x{width:36px;height:36px;padding:0;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.drawer label{font-size:12px;margin:14px 0 4px}
.facts{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 12px;font-size:13px;line-height:1.45}.facts dt{color:var(--muted);font-weight:600}.facts dd{margin:0}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.applist a{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--text);margin-bottom:8px}
.swrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line3)}
.sw{width:28px;height:28px;padding:0;border-radius:999px;border:2px solid var(--surface)}
.wd{display:flex;gap:10px;align-items:flex-start;margin:4px 0 12px;padding:10px;background:var(--note);border-radius:8px;font-size:13px;font-weight:400;line-height:1.45}
/* setup step 8: how Claude works for you */
.pgroup{border-top:1px solid var(--line3);margin-top:22px;padding-top:6px}.pgroup:first-of-type{border-top:0;margin-top:8px}
.pgroup h3{font-size:16px;margin:12px 0 2px}.pgroup>.sub{margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{height:auto;min-height:40px;padding:6px 14px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.chips button.sugg{border-style:dashed}
.chips button.have,.chips button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.addrow{display:flex;gap:8px}.addrow input{flex:1 1 auto}
.prule{margin:8px 0}.prule .check{margin:0;padding:6px 0}
.permrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line3)}
.permrow .seg button{min-width:84px}.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.locked{background:var(--note);border-radius:10px;padding:10px 14px;margin-top:14px}.locked h4{margin:4px 0;font-size:14px}
.locked .check{margin:0;padding:5px 0;color:var(--text3)}
/* help */
dl.defs{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px 18px;margin:0}dl.defs dt{font-weight:600}dl.defs dd{margin:0}
.help ul{margin:0;padding-left:20px}
@media (max-width:700px){header{padding:12px 16px}main{padding:16px}.two,dl.defs,.facts{grid-template-columns:1fr}.dom{grid-template-columns:1fr}.tools input[type=search]{width:100%}}
</style>
</head>
<body>
<header><p class="brand">Job Search Kit<span class="beta">Beta</span></p>
<nav aria-label="Main"><a href="#tracker" id="n-tracker">Applications</a><a href="#companies" id="n-companies">Companies</a><a href="#profile" id="n-profile">My search profile</a><a href="#contacts" id="n-contacts">Contacts</a><a href="#privacy" id="n-privacy">Privacy</a><a href="#help" id="n-help">Help</a><a href="#suggest" id="n-suggest">Suggest an idea</a>
<label for="theme" class="sr">Color theme</label><select id="theme"><option value="auto">Theme: match system</option><option value="light">Theme: light</option><option value="dark">Theme: dark</option></select></nav></header>
<main>
<section id="setup" hidden></section>
<section id="tracker" hidden></section>
<section id="companies" hidden></section>
<section id="profile" hidden></section>
<section id="contacts" hidden></section>
<section id="advanced" hidden></section>
<section id="privacy" hidden></section>
<section id="help" hidden></section>
</main>
<div id="drawer-root"></div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const TOKEN = new URLSearchParams(location.search).get("t") || "";   // this launch's key; every call carries it
try { if (TOKEN) history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}   // keep it out of the address bar and history
const api = async (path, body) => { const h = {"X-Kit-Token": TOKEN}; let r;
  try { r = await fetch(path, body === undefined ? {headers:h} : {method:"POST", headers:{...h, "Content-Type":"application/json"}, body:JSON.stringify(body)}); }
  catch (e) { closedNotice(); throw e; }
  return r.json(); };
function closedNotice() { if (document.getElementById("closed")) return; document.querySelector("main").insertAdjacentHTML("afterbegin",
  `<div class="note banner" id="closed"><b>This page has closed.</b> It stops after 30 minutes without use. Open Job Search Kit again from the Start menu.</div>`); }
const safeUrl = u => /^https?:\/\/[^\s]+$/i.test(String(u||"")) ? u : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lines = v => (v||[]).join("\n");
const unlines = s => s.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const ICON_I = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1a5 5 0 1 0 0 10A5 5 0 1 0 6 1z" stroke="currentColor" fill="none"></path><path d="M6 5.2V9M6 3v.2" stroke="currentColor" stroke-width="1.4"></path></svg>`;
const ICON_EDIT = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 10.5V12h1.5L11 4.5 9.5 3 2 10.5zM9.5 3L11 1.5 12.5 3 11 4.5" stroke="currentColor" stroke-width="1.3" fill="none"></path></svg>`;
const ICON_X = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" fill="none"></path></svg>`;
let A = null, step = 0, UI = {theme:"auto", status_colors:{}}, ST = {};

// ---------------------------------------------------------------- theme (kept in settings/app.json; localStorage only paints the first frame)
function applyTheme(t) { document.documentElement.dataset.theme = t || "auto"; $("#theme").value = t || "auto"; }
applyTheme(store.get("kit-theme", "auto"));
$("#theme").onchange = async e => { const t = e.target.value; applyTheme(t); store.set("kit-theme", t); UI.theme = t; await api("/api/ui", {theme:t}); };
window.addEventListener("storage", e => { if (e.key === "kit-theme") { try { applyTheme(JSON.parse(e.newValue)); } catch (x) {} }
  if (e.key === "kit-colors" && !$("#tracker").hidden) renderTracker(); });

const STEPS = [
 {key:"work", title:"The work you want", sub:"What you're looking for, in your own words.", fields:[
  ["titles","Job titles you're looking for","One per line, e.g. senior product manager","list"],
  ["field","What do you call your field?","e.g. product management, customer success, analytics","text"],
  ["never_titles","Words in a title that make it never right","One per line, e.g. intern, sales","list"],
  ["skip_title_words","Other title words to skip","e.g. vice president, intern","list"],
  ["ask_title_words","Title words that should ask you first","e.g. platform, head of","list"],
  ["level_at","Titles at your level","e.g. senior product manager, lead product manager","list"],
  ["level_below","Titles a step below that are still OK","","list"],
  ["level_junior","Titles that are too junior","e.g. associate, intern","list"],
  ["years","Years of experience in your field you can claim","","number"],
  ["years_words","How postings name that experience","e.g. product management, product manager","list"]]},
 {key:"where", title:"Where and how you work", sub:"Remote, hybrid, or onsite, and your limits.", custom:"where"},
 {key:"rules", title:"Rules that rule a job out", sub:"Things that make a job a no for you.", custom:"rules"},
 {key:"pay", title:"Pay", sub:"Base pay, before bonus or equity.", fields:[
  ["floor","Lowest base pay you'd take","Postings below this are skipped","number"],
  ["target","Pay you're aiming for","","number"],
  ["rank_no_pay_lower","Rank postings with no posted pay lower","","bool"]]},
 {key:"fields", title:"Fields and companies", sub:"What interests you, and where you'd love to work.", custom:"fields"},
 {key:"resume", title:"Your resume", sub:"Format and abbreviations. Words to never use are in step 8, How Claude works for you. Your stories come from the Start Here interviews with Claude.", fields:[
  ["name","Your name as it appears on your resume","","text"],["headline","Your resume headline","e.g. Senior Product Manager | Patient Scheduling","text"],
  ["font","Font","","text"],["body_pt","Body size (points)","","number"],["name_pt","Name size","","number"],["heading_pt","Heading size","","number"],
  ["margin_in","Margins (inches)","","number"],["line_spacing","Line spacing","","number"],
  ["abbreviations","Abbreviations to spell out","","list"],
  ["retired","Wording you've retired","Phrases that should never come back","list"],["once_per_resume","Figures that may appear only once per resume","","list"]]},
 {key:"run", title:"How it runs", sub:"When it checks for new jobs.", fields:[
  ["full","Main daily check","Fetches, scores, and tidies your tracker","time"],
  ["quick","Quick checks during the day","One time per line, like 14:00","list"],
  ["auto_update","Install updates automatically","Checks this project's GitHub page once a day. Off means you update with Check for updates in the Start menu","bool"]]},
 {key:"prefs", title:"How Claude works for you", sub:"Pick what fits and skip the rest. Everything here is optional, and you can change it anytime. Claude reads these choices every time it drafts for you.", custom:"prefs"},
];

function input(key, sec, [k, label, hint, kind]) {
  const v = A[sec][k]; const id = `${sec}.${k}`;
  const h = hint ? ` <span class="hint">${esc(hint)}</span>` : "";
  if (kind === "list") return `<label for="${id}">${esc(label)}${h}</label><textarea id="${id}" data-k="${id}" data-kind="list">${esc(lines(v))}</textarea>`;

  p.obvious_calls = val("p-obv") || p.obvious_calls;

  p.keep_general = plines($("#p-private").value);
  p.talk_it_through = $("#p-talk").checked; }
function wirePrefs() {
  const addTool = name => { const t = String(name || "").trim(); if (!t) return;
    if (!A.prefs.tools.some(x => x.toLowerCase() === t.toLowerCase())) A.prefs.tools.push(t);
    $("#ptools").innerHTML = prefTools(); $("#p-newtool").value = ""; };
  $("#ptools").onclick = e => { const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.rmtool !== undefined) { A.prefs.tools.splice(Number(b.dataset.rmtool), 1); $("#ptools").innerHTML = prefTools(); }
    else if (b.dataset.addtool) addTool(b.dataset.addtool); };
  $("#p-addtool").onclick = () => addTool($("#p-newtool").value);
  $("#p-newtool").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addTool(e.target.value); } };
  $("#phabits").onclick = e => { const b = e.target.closest("[data-habit]"); if (!b) return;
    const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on));
    b.firstChild.textContent = (on ? "✓" : "+") + b.firstChild.textContent.slice(1); };
  $$("[data-perm]").forEach(b => b.onclick = () => { $$(`[data-perm="${b.dataset.perm}"]`).forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-pressed", String(on)); }); });
}
function domRow(d={name:"",interest:"medium",keywords:[]}) { return `<div class="dom" data-points="${d.points ?? ""}" data-was="${esc(d.interest)}"><input type="text" class="dn" placeholder="Field" value="${esc(d.name)}">

  <input type="text" class="dk" placeholder="Words, separated by commas" value="${esc((d.keywords||[]).join(", "))}"><button type="button" class="rm" aria-label="Remove">Remove</button></div>`; }
function boardList() { const f = A.fields; const all = [...f.boards.map((b,i)=>`${esc(b.name)} <small>(${esc(b.platform)})</small>` + (b.platform === "workday"

function collect() {
  const s = STEPS[step];
  document.querySelectorAll("#setup [data-k]").forEach(el => { const [sec,k] = el.dataset.k.split("."); const kind = el.dataset.kind;
    A[sec][k] = kind==="list" ? unlines(el.value) : kind==="bool" ? el.checked : kind==="number" ? (el.value===""?null:Number(el.value)) : el.value; });
  if (s.custom==="where") { const w=A.where; w.mode = $("input[name=mode]:checked").value; w.home = $("#home").value; w.commute_areas = unlines($("#areas").value);
    w.max_office_days = $("#days").value===""?null:Number($("#days").value); w.onsite_ok = $("#onsite").checked; w.relocation_ok = $("#reloc").checked; }

    r.contract_ok=$("input[name=ct]:checked").value==="yes"; r.travel_max_pct=Number($("#travel").value||0); r.excluded_industries=unlines($("#ind").value);
    r.excluded_companies=unlines($("#cos").value); r.exception_words=unlines($("#exc").value); r.benefits_rule=$("#ben").checked; }

function renderSetup(msg="") {
  const s = STEPS[step]; const done = step === STEPS.length;
  $("#setup").innerHTML = `<div class="steps">${STEPS.map((x,i)=>`<button type="button" data-step="${i}" class="${i===step?"on":""}">${i+1}. ${esc(x.title)}</button>`).join("")}<button type="button" data-step="${STEPS.length}" class="${done?"on":""}">Finish</button></div>
   <div class="card">${done ? `<h2>You're set up</h2><p class="sub">Your answers are saved. Two last things:</p>
     <p><button class="primary" id="sched">Turn on the daily checks</button> <span id="smsg"></span></p>
     <div class="note">Next, open the Claude app, open your Job Search folder, and type <b>/start-here</b>. Claude will interview you about your work and build your evidence bank and master resume.</div>
     <p><a href="#tracker">Open your tracker</a> · You can change any answer here later.</p>`
   : `<h2>${esc(s.title)}</h2><p class="sub">${esc(s.sub)}</p>${s.fields ? s.fields.map(f=>input(f[0], s.key, f)).join("") : custom(s.custom)}
     <div class="bar"><button type="button" id="back" ${step===0?"disabled":""}>Back</button><span id="msg" class="ok">${esc(msg)}</span><button type="button" class="primary" id="next">Save and continue</button></div>`}</div>`;
  document.querySelectorAll("[data-step]").forEach(b => b.onclick = async () => { if (!done) await save(false); step = Number(b.dataset.step); renderSetup(); });
  if (done) { $("#sched").onclick = async () => { const r = await api("/api/schedule/install", {}); $("#smsg").textContent = r.message || r.error; $("#smsg").className = r.ok ? "ok" : "err"; }; return; }
  $("#next").onclick = async () => { if (await save(true)) { step++; renderSetup(); window.scrollTo(0,0); } };
  $("#back").onclick = async () => { await save(false); step--; renderSetup(); };
  if (s.custom==="prefs") wirePrefs();
  if (s.custom==="where") document.querySelectorAll("input[name=mode]").forEach(r => r.onchange = () => { $("#office").hidden = r.value==="remote"; $("#onsite-wrap").hidden = r.value!=="any"; });
  if (s.custom==="fields") {
    $("#adddom").onclick = () => $("#doms").insertAdjacentHTML("beforeend", domRow());
    $("#doms").onclick = e => { if (e.target.classList.contains("rm")) e.target.closest(".dom").remove(); };
    $("#boards").onchange = e => { if (e.target.classList.contains("wdok")) A.fields.boards[Number(e.target.dataset.i)].workday_ok = e.target.checked; };
    $("#boards").onclick = e => { if (!e.target.classList.contains("rmb")) return; const i = Number(e.target.dataset.i), nb = A.fields.boards.length;
      if (i < nb) A.fields.boards.splice(i,1); else A.fields.custom_sites.splice(i-nb,1); $("#boards").innerHTML = boardList(); };
    $("#detect").onclick = async () => { $("#dmsg").textContent = "Looking..."; const r = await api("/api/detect", {url:$("#burl").value, name:$("#bname").value});
      if (r.board) { A.fields.boards.push(r.board); $("#dmsg").textContent = r.board.platform === "workday" ? "Found a Workday board. It stays off until you tick the box under it." : `Found ${r.board.platform} board.`; } else if (r.custom) { A.fields.custom_sites.push(r.custom); $("#dmsg").textContent = "No standard board; added to check by hand."; } else $("#dmsg").textContent = r.error || "Couldn't check that link.";
      $("#boards").innerHTML = boardList(); $("#burl").value = ""; $("#bname").value = ""; };
  }
}

const pill = (text, color) => `<span class="pill p-${esc(color || "gray")}">${esc(text)}</span>`;

const fit100 = r => r["Role Fit Score"] === "" || r["Role Fit Score"] == null ? null : Math.round(Number(r["Role Fit Score"]) * 10);
function fitPill(f) { if (f == null) return `<span class="muted">-</span>`;
  const h = f < 45 ? 0 : f < 60 ? 28 : f < 75 ? 50 : 125;   // red, orange, yellow, green (Help page bands)
  return `<span class="fit" style="background:hsl(${h},var(--fit-bg-s),var(--fit-bg-l));color:hsl(${h},var(--fit-fg-s),var(--fit-fg-l))">${f}</span>`; }
const workOf = r => r["Remote Status"] === "Fully Remote" ? "Remote" : ["Hybrid","Onsite"].includes(r["Remote Status"]) ? r["Remote Status"] : "Not stated";
const payOf = r => r["Base Salary"] ? "$" + Math.round(Number(r["Base Salary"]) / 1000) + "k" : "Not listed";
const fmtDate = d => { if (!d) return ""; const t = new Date(String(d).slice(0,10) + "T12:00:00"); return isNaN(t) ? String(d) : t.toLocaleDateString(undefined, {month:"short", day:"numeric"}); };
const rating = v => v == null || v === "" ? "Unknown" : Number(v).toFixed(1) + " of 5";
const pct = v => v == null || v === "" ? "Unknown" : Number(v) + "%";
const orUnknown = v => v ? v : "Unknown";
function sortRows(rows, keys, sort) {
  const fn = (keys.find(k => k[0] === sort.key) || keys[0])[2];
  return rows.slice().sort((a, b) => { const x = fn(a), y = fn(b); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir; });
}
function headCells(keys, sort, extra="") {
  return keys.map(([k, label]) => `<div role="columnheader"><button type="button" data-sort="${k}">${esc(label)}<span aria-hidden="true" style="color:var(--accent)">${sort.key === k ? (sort.dir > 0 ? "▲" : "▼") : ""}</span></button></div>`).join("") + extra;
}
function bindSort(el, viewKey, view, rerender) {
  $$("[data-sort]", el).forEach(b => b.onclick = () => { const k = b.dataset.sort;
    view.sort = {key:k, dir: view.sort.key === k ? -view.sort.dir : 1}; store.set(viewKey, view); rerender(); });
}

function coFor(r) { return C.rows.find(c => (r.company_id && c.id === r.company_id) || (!r.company_id && c.name.toLowerCase() === String(r.Company||"").toLowerCase())) || null; }

    ${all.length ? "" : `<p style="margin:0;padding:24px" class="muted">${T.rows.length ? "Nothing matches. Clear the search." : "Nothing here yet. New postings arrive after the first daily check, or press Add a posting."}</p>`}</div>`;

  $("#colors").onclick = openColors; $("#addp").onclick = openAddPosting;
  $$("[data-group]", el).forEach(b => b.onclick = () => { view.collapsed[b.dataset.group] = !view.collapsed[b.dataset.group]; store.set(APPS_VIEW, view); drawTracker(); });
  $$("[data-edit]", el).forEach(b => b.onclick = () => openApp(b.dataset.edit));

}

const ADV = {"agent.FRESH_DAYS":"Days a posting counts as fresh","agent.FRESH_ALERT_DAYS":"How new a top posting must be to alert you (days)",
 "agent.EVERGREEN_AGE_DAYS":"Days open before a posting is flagged as likely evergreen","agent.AGE_NOTE_DAYS":"Days open before a posting gets an age note","agent.REPOST_WINDOW_DAYS":"How far back to catch reposts (days)",
 "agent.GHOST_FLAG_IDS":"Reposts under new IDs before a posting is flagged","agent.GHOST_FLAG_LOCATIONS":"Locations for one role before it's flagged","agent.GHOST_SKIP_IDS":"Reposts before it's skipped"};
async function renderAdvanced() {
  const v = await api("/api/advanced"); const el = $("#advanced");
  el.innerHTML = `<div class="card"><h2>Advanced</h2><p class="sub">Most people never change these. The defaults work well.</p>
   ${Object.entries(ADV).map(([k,l])=>`<label for="${k}">${l}</label><input id="${k}" type="number" min="0" value="${esc(v[k])}">`).join("")}
   <p><button class="primary" id="savea">Save</button> <span id="advmsg" class="ok"></span></p></div>`;
  $("#savea").onclick = async () => { const out = Object.fromEntries(Object.keys(ADV).map(k=>[k, $("#"+CSS.escape(k)).value])); const r = await api("/api/advanced", out); $("#advmsg").textContent = r.ok ? "Saved." : r.error; };
}

const PRIVACY_HTML = `<div class="card"><h2>What stays here, what goes to Claude, and what you promise</h2>
   <p class="sub">Plain words, no legal language. Read it once before you start.</p>
   <h3>Stays on this computer</h3>
   <p>Your settings, your evidence bank, your resumes and cover letters, your applications, your contacts, and your tracker are plain files in the folder you choose. The daily job checks, the scoring, and the pre-send gate run here. The kit connects to no email account and no other account of yours.</p>
   <h3>Goes out</h3>
   <p>Requests to the job boards you picked (they see a request from this computer and the kit's name, nothing about you). Once a day, a check of this project's GitHub releases page for updates (GitHub sees your computer's internet address, nothing else); you can turn that off under My search profile, How it runs. When you use the Claude plugin, whatever you put in front of Claude: your evidence bank, the posting, the draft, your answers. That goes to Anthropic under your own Claude plan's terms. Nothing goes to the person who made this kit except an error report you choose to send, and that report holds error lines only.</p>
   <h3>What you promise</h3>
   <p>Every bullet on your resume is true, in your words, and you confirm each one before it goes on a page. The kit traces every bullet back to your evidence bank and refuses anything that isn't there, but you are the one who knows what's true. If an application asks whether AI helped write your materials, answer honestly: Claude helped you select and arrange your own evidence, and you reviewed every line.</p>
   <h3>This is a free beta</h3>
   <p>The kit is free, provided as is, with no guarantee that it works or that its scores and drafts are right. It can miss a posting, score one wrong, or draft a line you wouldn't say. You review and confirm everything before you send it, and you are responsible for every application, resume, letter, and message you send. The kit never sends anything for you.</p>
   <h3>If you change your mind</h3>
   <p>The kit keeps a daily backup of your tracker, contacts, evidence bank, and settings for 14 days, on this computer only (in the data folder, under backups). Logs are kept about 30 days. Copy the folder to keep your own copy. To remove your data, use Delete your data on the Privacy page. Uninstalling the app leaves the folder alone.</p>
   <p><label><input type="checkbox" id="privok"> I've read this. I understand the kit is a free beta, provided as is, and that I review and send everything myself.</label> <span id="privmsg"></span></p></div>`;
const DELETE_HTML = `<div class="card"><h2>Delete your data</h2>
   <p class="sub">This can't be undone, and it removes the daily backups too. Copy your folder first if you might want anything back.</p>
   <div class="choice">
    <label><input type="radio" name="delscope" value="records" checked> Tracker, contacts, backups, and logs only<br><small>Keeps your evidence bank, applications, and settings.</small></label>
    <label><input type="radio" name="delscope" value="everything"> Everything the kit made<br><small>Also your evidence bank, applications, resumes, settings, and the daily schedule. Files you added yourself stay.</small></label>
   </div>
   <label for="delconfirm">Type <b>delete my data</b> to confirm</label><input id="delconfirm" type="text" autocomplete="off">
   <p><button id="delgo">Delete</button> <span id="delmsg"></span></p></div>`;
function renderPrivacy(next) {
  const el = next ? $("#setup") : $("#privacy"); el.innerHTML = PRIVACY_HTML;
  if (!next) el.insertAdjacentHTML("beforeend", DELETE_HTML);
  const box = $("#privok"); if (!next) { try { box.checked = localStorage.getItem("privacy_ok") === "1"; } catch (e) {} }
  if (!next) $("#delgo").onclick = async () => {
    const scope = document.querySelector("input[name=delscope]:checked").value;
    const r = await api("/api/delete_data", {scope, confirm: $("#delconfirm").value});
    if (!r.ok) { $("#delmsg").textContent = r.error || "Couldn't delete."; $("#delmsg").className = "err"; return; }
    $("#delmsg").className = "ok";
    $("#delmsg").textContent = scope === "everything"
      ? (r.folder_left ? "Deleted. Files you added yourself are still in the folder. You can uninstall the app in Windows Settings, Apps." : "Deleted. You can uninstall the app in Windows Settings, Apps.")
      : "Your tracker, contacts, backups, and logs are deleted. Your evidence bank and applications are still there.";
  };
  box.onchange = async () => { try { localStorage.setItem("privacy_ok", box.checked ? "1" : "0"); } catch (e) {}
    if (box.checked) { const r = await api("/api/acknowledge", {}); if (r && r.ok === false && !r.later) { $("#privmsg").textContent = "Couldn't save that; try again."; return; } }
    if (box.checked && next) next(); };
}
function privacyRead() { try { return localStorage.getItem("privacy_ok") === "1"; } catch (e) { return true; } }
async function renderFolder() {
  const f = await api("/api/folder"); const el = $("#setup");
  el.innerHTML = `<div class="card"><h2>Where should your Job Search folder live?</h2>
   <p class="sub">This folder will hold your settings, your evidence bank, your applications, and your tracker. Everything stays on this computer either way.</p>
   ${f.documents_synced ? `<div class="note banner">Your Documents folder is backed up to a cloud service (OneDrive or similar). That means your resumes and evidence bank would be copied there too. Pick what you prefer.</div>` : ""}
   <div class="choice">
    <label><input type="radio" name="fold" value="documents" ${f.documents_synced ? "" : "checked"}> ${esc(f.documents.label)}<br><small>${esc(f.documents.path)}</small></label>
    <label><input type="radio" name="fold" value="local" ${f.documents_synced ? "checked" : ""}> ${esc(f.local.label)}<br><small>${esc(f.local.path)}</small></label>
   </div>
   <p><button class="primary" id="foldok">Create the folder</button> <span id="foldmsg"></span></p></div>`;
  $("#foldok").onclick = async () => { $("#foldmsg").textContent = "Creating..."; const choice = document.querySelector("input[name=fold]:checked").value;
    const r = await api("/api/folder", {choice, acknowledged: privacyRead()}); if (r.ok) { A = null; route(); } else $("#foldmsg").textContent = r.error || "Couldn't create the folder."; };
}

async function route() {
  let page = (location.hash || "#tracker").slice(1);
  const anchor = page === "suggest" ? "suggest" : "";
  if (anchor) page = "help";
  const PAGES = ["setup","tracker","companies","profile","contacts","advanced","privacy","help"];
  if (!PAGES.includes(page)) page = "tracker";
  closeDrawer();
  ST = await api("/api/status");
  UI = {theme: ST.theme, status_colors: ST.status_colors || {}};
  applyTheme(ST.theme); store.set("kit-theme", ST.theme); store.set("kit-colors", UI.status_colors);
  if (page !== "setup" && page !== "privacy" && page !== "help" && (ST.needs_folder || ST.needs_ack || !ST.configured)) page = "setup";
  PAGES.forEach(p => { $("#"+p).hidden = p !== page; const n = $("#n-"+p); if (n) n.classList.toggle("on", p === page && !anchor); });
  $("#n-suggest").classList.toggle("on", !!anchor);
  $("main").classList.toggle("narrow", !["tracker","companies"].includes(page));
  if (page==="setup") { if (ST.needs_folder) { if (!privacyRead()) { renderPrivacy(route); return; } renderFolder(); return; }
    if (ST.needs_ack) { renderPrivacy(route); return; } if (!A) A = await api("/api/answers"); renderSetup(); }
  if (page==="privacy") renderPrivacy();
  if (page==="tracker") renderTracker();
  if (page==="companies") renderCompanies();
  if (page==="profile") renderProfile();
  if (page==="contacts") renderContacts();
  if (page==="advanced") renderAdvanced();
  if (page==="help") { renderHelp(); if (anchor) $("#suggest").scrollIntoView(); else window.scrollTo(0,0); }
}
window.addEventListener("hashchange", route); route();
</script>
</body>
</html>
