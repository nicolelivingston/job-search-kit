<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Kit</title>
<style>
:root{--bg:#f5f4f1;--surface:#ffffff;--surface2:#faf9f6;--group:#f3f1ec;--col:#ecebe6;--note:#f7f5f0;--chip:#f1efea;--text:#1f2328;--text2:#3a3f46;--text3:#4a4f57;--muted:#5b616b;--line:#e4e1da;--line2:#d6d2c9;--line3:#efece6;--accent:#2f5d8a;--accent-soft:#e9eff6;--accent-text:#1f4467;--sel:#eef3f9;--on-accent:#ffffff;--good:#1e5631;--bad:#8a1c14;--fit-bg-s:75%;--fit-bg-l:86%;--fit-fg-s:70%;--fit-fg-l:22%;--p-gray-bg:#eeeeee;--p-gray-fg:#3f444b;--p-blue-bg:#dfeaf7;--p-blue-fg:#1f4467;--p-teal-bg:#d8f0ec;--p-teal-fg:#0f5148;--p-green-bg:#e0f0e3;--p-green-fg:#1e5631;--p-yellow-bg:#fbf1c7;--p-yellow-fg:#5c4a00;--p-orange-bg:#fde3cc;--p-orange-fg:#7a3a00;--p-red-bg:#fadcd9;--p-red-fg:#8a1c14;--p-purple-bg:#ebe2f7;--p-purple-fg:#4b2a7a;--p-pink-bg:#f9dfeb;--p-pink-fg:#7d1d4d;--warn:#7a3a00;color-scheme:light}
:root[data-theme=dark]{--bg:#141517;--surface:#1d1f22;--surface2:#23262a;--group:#262a2e;--col:#191b1e;--note:#262a2e;--chip:#2c3035;--text:#e8e6e1;--text2:#c9c6bf;--text3:#b5b2ab;--muted:#a19e97;--line:#33373c;--line2:#43484e;--line3:#2a2e33;--accent:#3d6fa3;--accent-soft:#22324a;--accent-text:#9cc3ec;--sel:#1f2b3a;--on-accent:#ffffff;--good:#8fd19e;--bad:#f2a39b;--fit-bg-s:45%;--fit-bg-l:26%;--fit-fg-s:70%;--fit-fg-l:82%;--p-gray-bg:#33373c;--p-gray-fg:#d7d5d0;--p-blue-bg:#1f3550;--p-blue-fg:#a9cbef;--p-teal-bg:#143c37;--p-teal-fg:#8fdacb;--p-green-bg:#1b3a24;--p-green-fg:#9fd8ab;--p-yellow-bg:#3d3412;--p-yellow-fg:#ecd98a;--p-orange-bg:#45290f;--p-orange-fg:#f3b98a;--p-red-bg:#4a1d1a;--p-red-fg:#f2a7a0;--p-purple-bg:#34264a;--p-purple-fg:#cdb6f0;--p-pink-bg:#47203a;--p-pink-fg:#f0aed0;--warn:#f3b98a;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#141517;--surface:#1d1f22;--surface2:#23262a;--group:#262a2e;--col:#191b1e;--note:#262a2e;--chip:#2c3035;--text:#e8e6e1;--text2:#c9c6bf;--text3:#b5b2ab;--muted:#a19e97;--line:#33373c;--line2:#43484e;--line3:#2a2e33;--accent:#3d6fa3;--accent-soft:#22324a;--accent-text:#9cc3ec;--sel:#1f2b3a;--on-accent:#ffffff;--good:#8fd19e;--bad:#f2a39b;--fit-bg-s:45%;--fit-bg-l:26%;--fit-fg-s:70%;--fit-fg-l:82%;--p-gray-bg:#33373c;--p-gray-fg:#d7d5d0;--p-blue-bg:#1f3550;--p-blue-fg:#a9cbef;--p-teal-bg:#143c37;--p-teal-fg:#8fdacb;--p-green-bg:#1b3a24;--p-green-fg:#9fd8ab;--p-yellow-bg:#3d3412;--p-yellow-fg:#ecd98a;--p-orange-bg:#45290f;--p-orange-fg:#f3b98a;--p-red-bg:#4a1d1a;--p-red-fg:#f2a7a0;--p-purple-bg:#34264a;--p-purple-fg:#cdb6f0;--p-pink-bg:#47203a;--p-pink-fg:#f0aed0;--warn:#f3b98a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Inter,sans-serif}
a{color:var(--accent-text)}a:hover{color:var(--accent)}
button,input,select,textarea{color:inherit;font:inherit}
.sr{position:absolute;left:-9999px}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin:0}
.beta{font-size:11px;font-weight:600;border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
nav a{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--text)}
nav a.on{font-weight:600;background:var(--accent-soft);color:var(--accent-text)}
nav select{width:auto;min-height:0;height:36px;padding:0 8px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:13px;cursor:pointer}
main{max-width:1440px;margin:0 auto;padding:20px 24px 48px}
main.narrow{max-width:980px}
h1{margin:0 0 6px;font-size:24px}h2{font-size:18px;margin:0 0 6px}h3{font-size:14px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
label{display:block;font-weight:600;margin:14px 0 4px}.hint{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface)}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.two label{margin-top:0}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.choice label{display:flex;gap:8px;align-items:center;font-weight:400;margin:0;min-height:40px;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;background:var(--surface)}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input,input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}.check input{margin-top:2px;flex:0 0 auto}
button{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);cursor:pointer}
button.primary,a.primary{border:0;background:var(--accent);color:var(--on-accent);font-weight:600}
a.btn{display:inline-flex;align-items:center;height:38px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;text-decoration:none;color:var(--text)}
a.btn.primary{border:0;color:var(--on-accent)}
button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.steps button{height:32px;padding:0 10px;font-size:13px}
.bar{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.note{padding:10px 12px;border-radius:8px;background:var(--note);margin:12px 0}
.tip{margin:0 0 6px;max-width:74ch}.eg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--chip);border-radius:4px;padding:1px 4px;white-space:nowrap}
.grp{border-top:1px solid var(--line3);margin-top:22px;padding-top:4px}.grp>h3{font-size:16px;margin:12px 0 2px}.grp>.sub{margin:0 0 4px}
.note ul{margin:6px 0 0;padding-left:20px}.note li{margin:2px 0}
.blist{list-style:none;margin:8px 0;padding:0}.blist li{padding:10px 12px;border:1px solid var(--line3);border-radius:8px;margin-bottom:8px}
.blist .check{margin:6px 0 0;font-size:13px}.blist .bh{display:flex;justify-content:space-between;gap:10px;align-items:center}.blist .bh button{height:30px;flex:0 0 auto}.banner{border-left:4px solid var(--warn)}
.ok{color:var(--good)}.err{color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line3);vertical-align:top}
th{font-size:12px;color:var(--text3);font-weight:600}.scroll{overflow-x:auto}
.dom{display:grid;grid-template-columns:1.2fr .8fr 2fr auto;gap:8px;margin-bottom:8px;align-items:center}
/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tools>div{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{width:260px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;height:36px}
/* grid tables */
.grid{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.grid .gr{display:grid;align-items:center;border-bottom:1px solid var(--line3);background:var(--surface)}
.grid .gh{background:var(--surface2);border-bottom:1px solid var(--line)}
.grid .gh button{width:100%;min-height:36px;display:flex;gap:6px;align-items:center;background:none;border:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);text-align:left;padding:0 8px}
.grid .gr.gh>div{padding:4px 6px;overflow-wrap:normal}
.grid .gr>div{padding:10px 14px;min-width:0;overflow-wrap:anywhere}
.grid .gr.sel{background:var(--sel)}
.grid .group{border-bottom:1px solid var(--line);background:var(--group)}
.grid .group button{display:flex;gap:10px;align-items:center;width:100%;min-height:40px;padding:0 14px;border:0;background:none;font-weight:600;text-align:left}
.grid .group .m{color:var(--muted);font-weight:400;font-size:12px}
.grid .cols-apps{grid-template-columns:260px 230px 140px 112px 96px 100px 86px 160px 110px 60px;min-width:1354px}
.grid .cols-cos{grid-template-columns:240px 150px 140px 170px 110px 130px 150px 160px 130px 110px 180px 200px 170px 100px 130px 120px 110px 220px 240px 240px;min-width:3370px;align-items:start;font-size:13px;line-height:1.45}
.grid .cols-cos>div:first-child{position:sticky;left:0;z-index:1;background:inherit;border-right:1px solid var(--line3);display:flex;gap:6px;align-items:center}
.grid .gh.cols-cos>div:first-child{z-index:2}
.grid .gr>div.edit{padding:4px 6px}
.ib{flex:0 0 auto;width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.eb{width:40px;height:36px;padding:0;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.role{font-weight:600}.muted{color:var(--muted)}.green{color:var(--good)}.red{color:var(--bad)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.fit{display:inline-block;min-width:34px;text-align:center;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}
.newtag{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600}
.p-gray{background:var(--p-gray-bg);color:var(--p-gray-fg)}.p-blue{background:var(--p-blue-bg);color:var(--p-blue-fg)}.p-teal{background:var(--p-teal-bg);color:var(--p-teal-fg)}
.p-green{background:var(--p-green-bg);color:var(--p-green-fg)}.p-yellow{background:var(--p-yellow-bg);color:var(--p-yellow-fg)}.p-orange{background:var(--p-orange-bg);color:var(--p-orange-fg)}
.p-red{background:var(--p-red-bg);color:var(--p-red-fg)}.p-purple{background:var(--p-purple-bg);color:var(--p-purple-fg)}.p-pink{background:var(--p-pink-bg);color:var(--p-pink-fg)}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.board .col{flex:0 0 220px;background:var(--col);border-radius:12px;padding:10px}
.board .ch{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px}
.board .cards{display:flex;flex-direction:column;gap:8px}
.board .cards button{display:block;width:100%;height:auto;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.board .cards b{display:block;margin-bottom:4px}.board .cards span.co{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
/* drawer */
.backdrop{position:fixed;inset:0;z-index:20;border:0;padding:0;border-radius:0;height:auto;background:rgba(10,10,12,.18);cursor:default}
.drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(20,20,20,.08);overflow-y:auto;padding:20px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.x{width:36px;height:36px;padding:0;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.drawer label{font-size:12px;margin:14px 0 4px}
.facts{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 12px;font-size:13px;line-height:1.45}.facts dt{color:var(--muted);font-weight:600}.facts dd{margin:0}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.applist a{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--text);margin-bottom:8px}
.swrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line3)}
.sw{width:28px;height:28px;padding:0;border-radius:999px;border:2px solid var(--surface)}
.wd{display:flex;gap:10px;align-items:flex-start;margin:4px 0 12px;padding:10px;background:var(--note);border-radius:8px;font-size:13px;font-weight:400;line-height:1.45}
/* setup step 8: how Claude works for you */
.pgroup{border-top:1px solid var(--line3);margin-top:22px;padding-top:6px}.pgroup:first-of-type{border-top:0;margin-top:8px}
.pgroup h3{font-size:16px;margin:12px 0 2px}.pgroup>.sub{margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{height:auto;min-height:40px;padding:6px 14px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.chips button.sugg{border-style:dashed}
.chips button.have,.chips button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.addrow{display:flex;gap:8px}.addrow input{flex:1 1 auto}
.prule{margin:8px 0}.prule .check{margin:0;padding:6px 0}
.permrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line3)}
.permrow .seg button{min-width:84px}.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.locked{background:var(--note);border-radius:10px;padding:10px 14px;margin-top:14px}.locked h4{margin:4px 0;font-size:14px}
.locked .check{margin:0;padding:5px 0;color:var(--text3)}
/* health */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.tile .lab{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text3)}
.tile .num{font-size:30px;font-weight:700;line-height:1.2;margin:4px 0 2px}
.tile .num.good{color:var(--good)}.tile .num.warn{color:var(--warn)}.tile .num.bad{color:var(--bad)}
.tile .sm{font-size:13px;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.hgrid .card{margin-bottom:0}
.att{list-style:none;margin:0;padding:0}.att li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line3)}
.att li:last-child{border-bottom:0}.att .what{color:var(--muted);font-size:13px}
.wk{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.wk .track{position:relative;height:14px;background:var(--line3);border-radius:4px}
.wk .fill{height:100%;border-radius:4px;background:var(--accent)}.wk .fill.met{background:var(--good)}
.wk .goal{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--text3)}
.wk .n{text-align:right;font-weight:600}
@media (max-width:700px){.att li{grid-template-columns:1fr}}
/* help */
dl.defs{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px 18px;margin:0}dl.defs dt{font-weight:600}dl.defs dd{margin:0}
.help ul{margin:0;padding-left:20px}
@media (max-width:700px){header{padding:12px 16px}main{padding:16px}.two,dl.defs,.facts{grid-template-columns:1fr}.dom{grid-template-columns:1fr}.tools input[type=search]{width:100%}}
</style>
</head>
<body>
<header><p class="brand">Job Search Kit<span class="beta">Beta</span></p>
<nav aria-label="Main"><a href="#tracker" id="n-tracker">Applications</a><a href="#health" id="n-health">Health</a><a href="#companies" id="n-companies">Companies</a><a href="#skills" id="n-skills">Skills</a><a href="#profile" id="n-profile">My search profile</a><a href="#contacts" id="n-contacts">Contacts</a><a href="#privacy" id="n-privacy">Privacy</a><a href="#help" id="n-help">Help</a><a href="#suggest" id="n-suggest">Suggest an idea</a>
<label for="theme" class="sr">Color theme</label><select id="theme"><option value="auto">Theme: match system</option><option value="light">Theme: light</option><option value="dark">Theme: dark</option></select></nav></header>
<main>
<section id="setup" hidden></section>
<section id="tracker" hidden></section>
<section id="health" hidden></section>
<section id="companies" hidden></section>
<section id="skills" hidden></section>
<section id="profile" hidden></section>
<section id="contacts" hidden></section>
<section id="advanced" hidden></section>
<section id="privacy" hidden></section>
<section id="help" hidden></section>
</main>
<div id="drawer-root"></div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const TOKEN = new URLSearchParams(location.search).get("t") || "";   // this launch's key; every call carries it
try { if (TOKEN) history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}   // keep it out of the address bar and history
const api = async (path, body) => { const h = {"X-Kit-Token": TOKEN}; let r;
  try { r = await fetch(path, body === undefined ? {headers:h} : {method:"POST", headers:{...h, "Content-Type":"application/json"}, body:JSON.stringify(body)}); }
  catch (e) { closedNotice(); throw e; }
  return r.json(); };
function closedNotice() { if (document.getElementById("closed")) return; document.querySelector("main").insertAdjacentHTML("afterbegin",
  `<div class="note banner" id="closed"><b>This page has closed.</b> It stops after 30 minutes without use. Open Job Search Kit again from the Start menu.</div>`); }
const safeUrl = u => /^https?:\/\/[^\s]+$/i.test(String(u||"")) ? u : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lines = v => (v||[]).join("\n");
const unlines = s => s.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const ICON_I = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1a5 5 0 1 0 0 10A5 5 0 1 0 6 1z" stroke="currentColor" fill="none"></path><path d="M6 5.2V9M6 3v.2" stroke="currentColor" stroke-width="1.4"></path></svg>`;
const ICON_EDIT = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 10.5V12h1.5L11 4.5 9.5 3 2 10.5zM9.5 3L11 1.5 12.5 3 11 4.5" stroke="currentColor" stroke-width="1.3" fill="none"></path></svg>`;
const ICON_X = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" fill="none"></path></svg>`;
let A = null, step = 0, UI = {theme:"auto", status_colors:{}}, ST = {};

// ---------------------------------------------------------------- theme (kept in settings/app.json; localStorage only paints the first frame)
function applyTheme(t) { document.documentElement.dataset.theme = t || "auto"; $("#theme").value = t || "auto"; }
applyTheme(store.get("kit-theme", "auto"));
$("#theme").onchange = async e => { const t = e.target.value; applyTheme(t); store.set("kit-theme", t); UI.theme = t; await api("/api/ui", {theme:t}); };
window.addEventListener("storage", e => { if (e.key === "kit-theme") { try { applyTheme(JSON.parse(e.newValue)); } catch (x) {} }
  if (e.key === "kit-colors" && !$("#tracker").hidden) renderTracker(); });

// Words to type shown as examples: eg("data analyst", "analytics analyst")
const eg = (...w) => w.map(x => `<span class="eg">${esc(x)}</span>`).join(", ");
function input(key, sec, [k, label, hint, kind, tip]) {
  const v = A[sec][k]; const id = `${sec}.${k}`;
  const h = hint ? ` <span class="hint">${esc(hint)}</span>` : "";
  const tp = tip ? `<p class="hint tip">${tip}</p>` : "";   // tip is page text (may hold eg() markup), never user input
  if (kind === "list") return `<label for="${id}">${esc(label)}${h}</label>${tp}<textarea id="${id}" data-k="${id}" data-kind="list">${esc(lines(v))}</textarea>`;
  if (kind === "bool") return `<label><input type="checkbox" data-k="${id}" data-kind="bool" ${v?"checked":""}> ${esc(label)}</label>`;
  const t = kind === "number" ? "number" : kind === "time" ? "time" : "text";
  return `<label for="${id}">${esc(label)}${h}</label>${tp}<input id="${id}" type="${t}" data-k="${id}" data-kind="${kind}" value="${esc(v ?? "")}">`;
}

const plines = s => s.split(/\n/).map(x=>x.trim()).filter(Boolean);   // one per line; commas stay inside a line
function pradios(name, cur, opts) { return `<div class="choice" role="radiogroup">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${esc(v)}" ${cur===v?"checked":""}> ${esc(l)}</label>`).join("")}</div>`; }
function pcheck(id, label, on, extra="") { return `<label class="check" for="${id}"><input type="checkbox" id="${id}" ${extra} ${on?"checked":""}> <span>${label}</span></label>`; }
function prefTools() { const t = A.prefs.tools, have = new Set(t.map(x=>x.toLowerCase()));
  return `<div class="chips" aria-label="Your tools">${t.length ? t.map((x,i)=>`<button type="button" class="have" data-rmtool="${i}" aria-label="Remove ${esc(x)}">${esc(x)} ${ICON_X}</button>`).join("") : `<span class="hint">No tools added yet.</span>`}</div>
   <p class="hint" style="margin:10px 0 0">Common picks, tap to add</p>
   <div class="chips">${PREF.suggest.filter(x=>!have.has(x.toLowerCase())).map(x=>`<button type="button" class="sugg" data-addtool="${esc(x)}">+ ${esc(x)}</button>`).join("")}</div>`; }
function prefsHtml() { const p = A.prefs, v = p.voice, fr = p.format_rules, habits = new Set(v.avoid_habits);
  const rule = ([k,l]) => pcheck(`pr-${k}`, esc(l), fr[k], `data-rule="${k}"`);
  return `
  <div class="pgroup"><h3>Your tools</h3><p class="sub">List the tools you use at work. When Claude tailors a resume, it picks the ones that match each posting, so you don't have to trim this list yourself.</p>
   <div id="ptools">${prefTools()}</div>
   <label for="p-newtool">Add a tool</label><div class="addrow"><input id="p-newtool" type="text" placeholder="Type a tool and press Enter"><button type="button" id="p-addtool">Add</button></div></div>

  <div class="pgroup"><h3>Resume and letter format</h3><p class="sub">These follow common university career-office guidance, like Harvard's and MIT's, plus a few that help with tailoring. They're all on to start. Turn off anything you'd rather not follow.</p>
   <label>Resume</label><div class="prule">${PREF.resume.map(rule).join("")}</div>
   <label>Resume length</label>${pradios("p-pages", p.resume_pages, [["auto","Let Claude decide by experience"],["one","1 page"],["two","2 pages"]])}
   <label>Bullet length</label>${pradios("p-bullets", p.bullet_length, [["short","Short"],["medium","Medium"],["detailed","Detailed"]])}
   <label>Cover letter</label><div class="prule">${PREF.letter.map(rule).join("")}</div>
   <p class="hint">The resume builder always lists experience newest first, keeps formatting consistent, and uses the same font for the resume and letter.</p>
   <label for="p-own">Your own rules <span class="hint">One per line, for example: put certifications above education</span></label><textarea id="p-own">${esc(p.own_rules.join("\n"))}</textarea></div>

  <div class="pgroup"><h3>Writing voice</h3><p class="sub">Help Claude sound like you.</p>
   <label for="p-bugged">Think of the last AI draft that didn't sound like you. What bugged you?</label><textarea id="p-bugged" placeholder="Anything goes: a word, a habit, the tone, how long it was">${esc(v.what_bugged_you)}</textarea>
   <label>Common AI habits people notice <span class="hint">Suggestions only. Tap any you want Claude to avoid.</span></label>
   <div class="chips" id="phabits">${PREF.habits.map(([k,l])=>`<button type="button" data-habit="${k}" aria-pressed="${habits.has(k)}">${habits.has(k)?"✓":"+"} ${esc(l)}</button>`).join("")}</div>
   <label>Other habits</label><div class="prule">${pcheck("p-ox","Use the Oxford comma (red, white, and blue)",v.oxford_comma)}${pcheck("p-con","Use contractions (it’s, don’t)",v.contractions)}${pcheck("p-keep","Keep my wording when I give Claude a phrase",v.keep_my_wording)}</div>
   <label>Tone</label>${pradios("p-tone", v.tone, [["","No preference"],["plain","Plain and direct"],["warm","Warm and conversational"],["formal","Formal"],["match","Match each company"]])}
   <label for="resume.avoid_words">Words to never use <span class="hint">One per line. The checker also flags these on resumes and letters.</span></label><textarea id="resume.avoid_words" data-k="resume.avoid_words" data-kind="list">${esc(lines(A.resume.avoid_words))}</textarea>
   <label for="p-fixes">Fixes you've saved <span class="hint">When you fix a draft, Claude asks once whether to save the fix here, so it doesn't happen again. Delete a line to drop it.</span></label><textarea id="p-fixes">${esc(p.saved_fixes.join("\n"))}</textarea></div>

  <div class="pgroup"><h3>Feedback and drafts</h3><p class="sub">How Claude reviews your work and hands things back.</p>
   <label>Feedback on your materials</label>${pradios("p-fb", p.feedback, [["blunt","Blunt"],["balanced","Balanced"],["gentle","Gentle"]])}

   <label>When Claude needs you to decide</label>${pradios("p-dec", p.decisions, [["list","One numbered list of choices"],["conversation","Ask in conversation"]])}
   <label>When the answer seems obvious</label>${pradios("p-obv", p.obvious_calls, [["decide_and_tell","Decide and tell me, so I can veto"],["ask_first","Ask me first"]])}</div>

  <div class="pgroup"><h3>Files</h3><p class="sub">Finished resumes and cover letters are Word files (.docx). Word can save a copy as PDF when an application asks for one.</p>
   <div class="locked"><h4>Built in, so you can see your progress</h4>
    ${pcheck("pb-1","Every draft gets a version number (v1, v2, v3)",true,"disabled")}
    ${pcheck("pb-2","Tracks time and versions for each application, from first draft to sent, so you can see your process get faster",true,"disabled")}

   ${PREF.perms.map(([k,l])=>`<div class="permrow"><span>${esc(l)}</span><div class="seg" role="group" aria-label="${esc(l)}">${[["can","Can"],["ask","Ask first"],["never","Never"]].map(([lv,ll])=>`<button type="button" data-perm="${k}" data-level="${lv}" class="${p.permissions[k]===lv?"on":""}" aria-pressed="${p.permissions[k]===lv}">${ll}</button>`).join("")}</div></div>`).join("")}
   <div class="locked"><h4>Always on</h4><p class="hint" style="margin:0 0 4px">These protect you, so they can't be turned off.</p>
    ${pcheck("pa-1","Never invents accomplishments, numbers, or experience",true,"disabled")}
    ${pcheck("pa-2","Flags gaps honestly instead of covering them up",true,"disabled")}
    ${pcheck("pa-3","Fixes a correction in every document it touches",true,"disabled")}
    ${pcheck("pa-4","Never sends emails or messages for you",true,"disabled")}
    ${pcheck("pa-5","Never submits applications for you",true,"disabled")}</div></div>

  <div class="pgroup"><h3>Private details</h3><p class="sub">Anything that should stay general on your resume and cover letters? Claude keeps these vague on paper and can be specific in your private interview prep.</p>
   <label for="p-private">Keep these general <span class="hint">One per line, for example: client names, internal project names, or exact budgets</span></label><textarea id="p-private">${esc(p.keep_general.join("\n"))}</textarea></div>

  <div class="pgroup"><h3>Talk it through (optional)</h3><p class="sub">If you left a section blank, Claude asks up to three quick questions about it in your first chat. It asks once, and you can skip any question.</p>
   ${pcheck("p-talk","Yes, ask me once",p.talk_it_through)}</div>`; }
function collectPrefs() { const p = A.prefs, v = p.voice, val = n => ($(`input[name=${n}]:checked`) || {}).value;
  $$("[data-rule]").forEach(el => p.format_rules[el.dataset.rule] = el.checked);
  p.own_rules = plines($("#p-own").value);
  p.resume_pages = val("p-pages") || p.resume_pages; p.bullet_length = val("p-bullets") || p.bullet_length;
  v.what_bugged_you = $("#p-bugged").value.trim();
  v.avoid_habits = $$("#phabits [data-habit]").filter(b => b.getAttribute("aria-pressed") === "true").map(b => b.dataset.habit);
  v.oxford_comma = $("#p-ox").checked; v.contractions = $("#p-con").checked; v.keep_my_wording = $("#p-keep").checked;
  v.tone = val("p-tone") ?? v.tone;
  p.saved_fixes = plines($("#p-fixes").value);
  p.feedback = val("p-fb") || p.feedback; p.drafts = val("p-drafts") || p.drafts; p.decisions = val("p-dec") || p.decisions;
  p.obvious_calls = val("p-obv") || p.obvious_calls;
  $$("[data-perm].on").forEach(b => p.permissions[b.dataset.perm] = b.dataset.level);
  p.keep_general = plines($("#p-private").value);
  p.talk_it_through = $("#p-talk").checked; }
function wirePrefs() {
  const addTool = name => { const t = String(name || "").trim(); if (!t) return;
    if (!A.prefs.tools.some(x => x.toLowerCase() === t.toLowerCase())) A.prefs.tools.push(t);
    $("#ptools").innerHTML = prefTools(); $("#p-newtool").value = ""; };
  $("#ptools").onclick = e => { const b = e.target.closest("button"); if (!b) return;

function domRow(d={name:"",interest:"medium",keywords:[]}) { return `<div class="dom" data-points="${d.points ?? ""}" data-was="${esc(d.interest)}"><input type="text" class="dn" placeholder="Field" value="${esc(d.name)}">

function boardList() { const f = A.fields;
  const named = new Set([...f.boards, ...f.custom_sites].map(b => String(b.name).toLowerCase()));
  const loose = (f.watched||[]).filter(n => !named.has(n.toLowerCase()));   // followed closely, no board found yet

  const all = [...f.boards.map((b,i)=>[`<b>${esc(b.name)}</b> <small>(${esc(PLATFORM_LABEL[b.platform]||b.platform)} board, read daily${b.platform === "workday" ? " when turned on" : ""})</small>`, (b.platform === "workday"

function collect() {

    A[sec][k] = kind==="list" ? unlines(el.value) : kind==="bool" ? el.checked : kind==="number" ? (el.value===""?null:Number(el.value)) : el.value; });
  if (s.custom==="where") { const w=A.where; w.mode = $("input[name=mode]:checked").value; w.home = $("#home").value; w.commute_areas = unlines($("#areas").value);
    w.max_office_days = $("#days").value===""?null:Number($("#days").value); w.onsite_ok = $("#onsite").checked; w.relocation_ok = $("#reloc").checked; }
  if (s.custom==="rules") { const r=A.rules; r.direct_reports_ok=$("input[name=dr]:checked").value==="yes"; r.on_call_ok=$("input[name=oc]:checked").value==="yes";
    r.contract_ok=$("input[name=ct]:checked").value==="yes"; r.travel_max_pct=Number($("#travel").value||0); r.excluded_industries=unlines($("#ind").value);
    r.excluded_companies=unlines($("#cos").value); r.exception_words=unlines($("#exc").value); r.benefits_rule=$("#ben").checked; }
  if (s.custom==="fields") { const f=A.fields; f.domains=[...document.querySelectorAll(".dom")].map(r=>({name:$(".dn",r).value,interest:$(".di",r).value,keywords:unlines($(".dk",r).value),points:r.dataset.points?Number(r.dataset.points):null,was:r.dataset.was||null})).filter(d=>d.name.trim());
    f.current_field=$("#curf").value.trim(); f.feed=$("#feed").value; f.auto_follow=$("#autof").checked; }

function renderSetup(msg="") {

  $("#next").onclick = async () => { if (await save(true)) { step++; renderSetup(); window.scrollTo(0,0); } };
  $("#back").onclick = async () => { await save(false); step--; renderSetup(); };
  if (s.custom==="prefs") wirePrefs();
  if (s.custom==="where") document.querySelectorAll("input[name=mode]").forEach(r => r.onchange = () => { $("#office").hidden = r.value==="remote"; $("#onsite-wrap").hidden = r.value!=="any"; });

    $("#boards").onchange = e => { if (e.target.classList.contains("wdok")) A.fields.boards[Number(e.target.dataset.i)].workday_ok = e.target.checked;
      if (e.target.classList.contains("wch")) setWatched(e.target.dataset.name, e.target.checked); };
    $("#boards").onclick = e => { if (!e.target.classList.contains("rmb")) return; const f = A.fields; const i = Number(e.target.dataset.i), nb = f.boards.length, nc = f.custom_sites.length;
      const named = new Set([...f.boards, ...f.custom_sites].map(b => String(b.name).toLowerCase()));
      const loose = (f.watched||[]).filter(n => !named.has(n.toLowerCase()));
      const gone = i < nb ? f.boards.splice(i,1)[0].name : i < nb + nc ? f.custom_sites.splice(i-nb,1)[0].name : loose[i-nb-nc];
      setWatched(gone, false); $("#boards").innerHTML = boardList(); };
    const say = t => { $("#dmsg").textContent = t; };
    const finish = () => { $("#bconfirm").innerHTML = ""; $("#boards").innerHTML = boardList(); $("#burl").value = ""; $("#bname").value = ""; };
    const addBoard = board => { const f = A.fields; const key = JSON.stringify([board.platform, board.slug]).toLowerCase();
      if (!f.boards.some(b => JSON.stringify([b.platform, b.slug]).toLowerCase() === key)) f.boards.push(board);
      setWatched(board.name, true);
      say(board.platform === "workday" ? "Added. It's a Workday board, so it stays off until you tick the box under it." : `Added. The kit will read its ${PLATFORM_LABEL[board.platform]||board.platform} board every day.`); finish(); };
    $("#detect").onclick = async () => { const name = $("#bname").value.trim(), url = $("#burl").value.trim(); $("#bconfirm").innerHTML = "";

      say("Looking...");
      let r; try { r = url ? await api("/api/detect", {url, name}) : await api("/api/find_board", {name}); } catch (e) { say("Couldn't check that. Try again."); return; }
      if (r.error) { say(r.error); return; }
      if (r.board && r.sample && r.sample.length) {   // found by a guessed address: the user confirms it's the right company

        $("#byes").onclick = () => addBoard(r.board);

          m.className = r.ok ? "ok" : "err"; m.textContent = r.ok ? `Saved in your Job Search folder as "${r.name}". Claude starts from it in Start Here.` : (r.error || "Couldn't save that file."); }
        catch (x) { m.className = "err"; m.textContent = "Couldn't save that file. Try again."; } };
      fr.readAsDataURL(file); };
  }
}

const STATUS_ORDER = ["Interested","Drafting Resume","Applied","Interviewing","Offer","Closed","Rejected"];
const GROUPS = [["To Do",["Interested","Drafting Resume"]],["In Progress",["Applied","Interviewing"]],["Complete",["Offer","Closed","Rejected"]]];

const FIT_ORDER = ["Applying","Strong fit","Possible fit","Poor fit","Passed"];
const labelOf = r => r["Overall Verdict"] || "";
const labelPill = r => { const l = labelOf(r); return l ? pill(l, FIT_LABEL_COLOR[l] || "gray") : ""; };
const pill = (text, color) => `<span class="pill p-${esc(color || "gray")}">${esc(text)}</span>`;
const statusPill = s => pill(s, (UI.status_colors || {})[s] || "gray");
const fit100 = r => r["Role Fit Score"] === "" || r["Role Fit Score"] == null ? null : Math.round(Number(r["Role Fit Score"]) * 10);
function fitPill(f) { if (f == null) return `<span class="muted">-</span>`;
  const h = f < 45 ? 0 : f < 60 ? 28 : f < 75 ? 50 : 125;   // red, orange, yellow, green (Help page bands)
  return `<span class="fit" style="background:hsl(${h},var(--fit-bg-s),var(--fit-bg-l));color:hsl(${h},var(--fit-fg-s),var(--fit-fg-l))">${f}</span>`; }
const workOf = r => r["Remote Status"] === "Fully Remote" ? "Remote" : ["Hybrid","Onsite"].includes(r["Remote Status"]) ? r["Remote Status"] : "Not stated";
const payOf = r => r["Base Salary"] ? "$" + Math.round(Number(r["Base Salary"]) / 1000) + "k" : "Not listed";
const fmtDate = d => { if (!d) return ""; const t = new Date(String(d).slice(0,10) + "T12:00:00"); return isNaN(t) ? String(d) : t.toLocaleDateString(undefined, {month:"short", day:"numeric"}); };
const rating = v => v == null || v === "" ? "Unknown" : Number(v).toFixed(1) + " of 5";
const pct = v => v == null || v === "" ? "Unknown" : Number(v) + "%";
const orUnknown = v => v ? v : "Unknown";
function sortRows(rows, keys, sort) {
  const fn = (keys.find(k => k[0] === sort.key) || keys[0])[2];
  return rows.slice().sort((a, b) => { const x = fn(a), y = fn(b); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir; });
}
function headCells(keys, sort, extra="") {

}

// ---------------------------------------------------------------- Help

    ["Fit","How well the posting matches your search profile, 0 to 100, from the kit's scoring. The color runs red (not a good match, under 45), orange (lower fit, 45 to 59), yellow (medium fit, 60 to 74), and green (good match, 75 and up). Open the row to see why it scored that way."],

    ["Posted","When the posting first appeared. Newer postings get more replies, so apply early when you can."],
    ["Fit label","Next to the score. <b>Strong fit:</b> scores 70 or more and meets every stated requirement (or misses one with a score of 80 or more before the cap). <b>Possible fit:</b> worth a look; the reason is in the row's panel (a judgment call, a missing requirement, required items your evidence can't vouch for). <b>Poor fit:</b> a rule it broke, no posted pay, two or more missing requirements, or a weak score; hard-rule ones close, the rest stay open. The daily check writes these three. <b>Applying</b> and <b>Passed</b> are yours, set in the row's panel, and are never overwritten; Passed rows close on the next check."],

    ["Risk level","<b>Low:</b> nothing worrying found. <b>Some concerns:</b> a reorganization, mixed reviews, or unclear money. <b>High:</b> layoffs, a return-to-office push, or financial trouble. <b>Needs research:</b> not looked into yet."],
    ["Health benefits","1 to 5. 5 means low premiums and deductibles, good mental health and dental coverage; 3 is typical; 1 is minimal. \"Unknown\" until researched. 2 or lower counts as weak in Fit."],

   <div class="card" id="tips"><h2>Tips</h2><ul>

   <div class="card" id="broken"><h2>Something went wrong?</h2><p class="sub">Send an error report. It holds the kit's run log only, with names, emails, phone numbers, and links scrubbed out. Nothing about your postings, resume, or evidence bank. You press Send.</p>
    <div class="acts" style="margin-top:0"><button type="button" id="errrep">Send an error report</button><span id="ermsg"></span></div></div>
   <div class="card" id="suggest"><h2>Suggest an idea</h2>
    <p style="margin:0 0 14px;color:var(--text2)">Something that would make the kit better for you? Write it here, then pick how to send it. Nothing is sent until you press Send or Submit yourself.</p>
    <label for="sg-what" style="margin-top:0">What would you like the kit to do?</label><textarea id="sg-what" rows="3"></textarea>
    <label for="sg-why">What would it help you do? <span class="hint">Optional</span></label><textarea id="sg-why" rows="2"></textarea>
    <div class="acts">${ST.support_email_set ? `<button type="button" class="primary" id="sg-mail">Email it</button>` : ""}<a class="btn ${ST.support_email_set ? "" : "primary"}" id="sg-gh" href="${GH_NEW_ISSUE}" target="_blank" rel="noopener noreferrer">Suggest on GitHub</a><span id="sgmsg"></span></div>

    return GH_NEW_ISSUE + "?template=feature_request.md&labels=enhancement&title=" + encodeURIComponent(title) + "&body=" + encodeURIComponent(body); };

async function renderContacts() {
  const rows = await api("/api/contacts"); const el = $("#contacts");
  const cols = [["name","Name"],["company","Company"],["role","Role"],["last","Last touch"],["notes","Notes"]];
  el.innerHTML = `<div class="card"><h2>Contacts</h2><p class="sub">People you're talking to. Saved on this computer only.</p><div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}<th></th></tr></thead><tbody>
   ${rows.map((r,i)=>`<tr>${cols.map(([k])=>`<td><input type="${k==="last"?"date":"text"}" data-i="${i}" data-k="${k}" value="${esc(r[k])}"></td>`).join("")}<td><button data-del="${i}">Remove</button></td></tr>`).join("")}</tbody></table></div>
   <p><button id="addc">Add a contact</button> <button class="primary" id="savec">Save</button> <span id="cmsg" class="ok"></span></p></div>`;
  const read = () => rows.map((r,i)=>Object.fromEntries(cols.map(([k])=>[k, el.querySelector(`[data-i="${i}"][data-k="${k}"]`)?.value || ""])));
  $("#addc").onclick = () => { const cur = read(); cur.push({}); api("/api/contacts", cur).then(renderContacts); };
  $("#savec").onclick = async () => { await api("/api/contacts", read()); $("#cmsg").textContent = "Saved."; };

// ---------------------------------------------------------------- health
const H_LEVEL = {good:"p-green", warn:"p-orange", bad:"p-red", mute:"p-gray"};
async function renderHealth() {
  const v = await api("/api/health"); const el = $("#health");
  if (v.error) { el.innerHTML = `<div class="card"><h2>Health</h2><p class="err">${esc(v.error)}</p></div>`; return; }
  const H = v.headline, D = v.drafting, C = v.contacts, T = v.targets;
  const tile = (lab, num, sm, cls) => `<div class="tile"><div class="lab">${lab}</div><div class="num ${cls||""}">${num ?? "&ndash;"}</div><div class="sm">${sm}</div></div>`;
  const fmt = d => d ? new Date(d + "T00:00:00").toLocaleDateString(undefined, {month:"short", day:"numeric"}) : "";
  const weekCls = !H.weekly_target ? "" : H.sent_week >= H.weekly_target ? "good" : "";
  const tiles = [
    tile("In progress", H.in_progress, "applied or interviewing"),
    tile("Interviews", H.interviews, "got to a real conversation", H.interviews ? "good" : ""),
    tile("Sent, last 30 days", H.sent_30, `of ${H.sent_total} sent in all`, H.sent_30 === 0 && H.sent_total ? "warn" : ""),
    tile("Interview rate", H.interview_rate === null ? null : H.interview_rate + "%", "of applications sent"),
    tile("Sent this week", H.sent_week, H.weekly_target ? `target ${H.weekly_target}; ${H.weeks_hit} of the last ${H.weeks_finished} weeks on target` : "no weekly target set", weekCls),
  ];
  if (C.target) tiles.push(tile("Contacts this week", C.this_week, `target ${C.target}; ${C.last_4_weeks} in the last 4 weeks`, C.this_week >= C.target ? "good" : ""));
  if (H.goal_date) tiles.push(tile("Days left", H.days_left, `to ${esc(fmt(H.goal_date))}`, H.days_left <= 14 ? "warn" : ""));
  const att = v.attention.length ? `<ul class="att">${v.attention.map(a => `<li><span><span class="pill ${H_LEVEL[a.level]||"p-gray"}">${esc(a.kind)}</span></span>
     <span><b>${esc(a.company)}</b>${a.role ? " · " + esc(a.role) : ""}<br><span class="what">${esc(a.what)}</span></span></li>`).join("")}</ul>
     ${v.attention_more ? `<p class="sub" style="margin-top:8px">${v.attention_more} more on the <a href="#tracker">Applications</a> page.</p>` : ""}`
    : `<p class="muted">Nothing waiting on you right now.</p>`;
  const max = Math.max(1, T.WEEKLY_TARGET, ...v.weeks.map(w => w.sent));
  const weeks = v.weeks.map(w => `<div class="wk"><span>${esc(fmt(w.week))}</span><span class="track" title="${w.sent} sent">
     <span class="fill ${w.target && w.sent >= w.target ? "met" : ""}" style="display:block;width:${Math.round(100*w.sent/max)}%"></span>
     ${w.target ? `<span class="goal" style="left:${Math.round(100*w.target/max)}%"></span>` : ""}</span><span class="n">${w.sent}</span></div>`).join("");
  const trend = D.versions_recent === null ? "Once you send a few applications with Resume Versions filled in, this shows whether drafts are taking fewer rounds."
    : D.versions_earlier === null ? `Median of ${D.versions_recent} resume versions over your first ${D.sends} sends. The comparison starts after 6 sends.`
    : `Median of <b>${D.versions_recent}</b> resume versions over your last 5 sends, against <b>${D.versions_earlier}</b> for the ${D.sends - 5} before them. ${D.versions_recent < D.versions_earlier ? "Drafts are taking fewer rounds." : D.versions_recent > D.versions_earlier ? "Drafts are taking more rounds lately." : "About the same as before."}`;
  el.innerHTML = `<h1>Health</h1><p class="sub">${esc(v.takeaway)} ${H.open_postings} posting${H.open_postings === 1 ? "" : "s"} still open. Worked out from your tracker each time you open this page.</p>
   <div class="tiles">${tiles.join("")}</div>
   <div class="hgrid">
    <div class="card"><h2>Needs you today</h2><p class="sub">Interviews, follow-ups due, open drafts, Strong fit rows waiting on your call, and applications with no reply after ${T.NO_REPLY_DAYS} days.</p>${att}</div>
    <div class="card"><h2>Applications sent by week</h2><p class="sub">Last 8 weeks, by Date Applied${H.weekly_target ? `. The dashed line is your target of ${H.weekly_target}; green weeks met it` : ""}.</p>${weeks}
     <h3>Is drafting getting easier?</h3><p>${trend}</p>
     <p class="sub">${D.days_median === null ? "" : `Median ${D.days_median} days from first draft to sending. `}${D.hours_median === null ? "" : `Median ${D.hours_median} hours per application (${D.hours_kept} with time kept). `}${D.drafts_open} draft${D.drafts_open === 1 ? "" : "s"} open now.${D.since ? ` Counts sends since ${esc(fmt(D.since))}.` : ""}</p></div>
   </div>
   <details class="card" style="margin-top:16px"><summary><b>Your targets</b> <span class="hint">change what this page measures against</span></summary>
    <div class="row">
     <div><label for="ht-w">Applications a week <span class="hint">0 hides the line</span></label><input id="ht-w" type="number" min="0" max="50" value="${esc(T.WEEKLY_TARGET)}"></div>
     <div><label for="ht-c">Contact touches a week <span class="hint">0 hides the tile</span></label><input id="ht-c" type="number" min="0" max="50" value="${esc(T.CONTACTS_TARGET)}"></div>
     <div><label for="ht-n">Days with no reply before it shows</label><input id="ht-n" type="number" min="1" max="365" value="${esc(T.NO_REPLY_DAYS)}"></div>
     <div><label for="ht-g">Goal date <span class="hint">optional</span></label><input id="ht-g" type="date" value="${esc(T.GOAL_DATE)}"></div>
    </div>
    <p><button class="primary" id="ht-save">Save targets</button> <span id="ht-msg"></span></p>
    <p class="hint">Contact touches count the Last touch dates on the Contacts page.</p></details>`;
  $("#ht-save").onclick = async () => {
    const r = await api("/api/health", {WEEKLY_TARGET: $("#ht-w").value, CONTACTS_TARGET: $("#ht-c").value, NO_REPLY_DAYS: $("#ht-n").value, GOAL_DATE: $("#ht-g").value});
    const m = $("#ht-msg"); if (r.ok) { await renderHealth(); $("#ht-msg").className = "ok"; $("#ht-msg").textContent = "Saved."; } else { m.className = "err"; m.textContent = r.error; } };
}

const SKILL_PILL = {"Skilled":"p-green","Partial gap":"p-yellow","Gap":"p-red"};
let SKILLS_GAPS_ONLY = false;
function chg(v, pts) { if (v === null || v === undefined) return '<span class="muted">new</span>'; const n = pts ? Math.round(v*100) : v;
  return n > 0 ? `<span class="green">+${n}</span>` : n < 0 ? `<span class="red">${n}</span>` : "0"; }
async function renderSkills() {
  const v = await api("/api/skills"); const el = $("#skills"); const L = v.latest;
  const rows = (L && L.rows) || []; const counted = new Set(rows.map(r=>r.name));
  const waiting = v.skills.filter(s=>s.track && !counted.has(s.name));
  const shown = rows.filter(r => !SKILLS_GAPS_ONLY || r.status !== "Skilled");
  const pill = s => `<span class="pill ${SKILL_PILL[s]||"p-gray"}">${esc(s)}</span>`;
  const head = L ? `Week of ${esc(L.date)}: ${L.matched} ${L.matched===1?"posting":"postings"} matched your search${L.previous ? `, changes since ${esc(L.previous)}` : ""}.`
                 : `No ranking yet. The morning run builds it within a day of your first skills, then every ${v.refresh_days} days.`;
  el.innerHTML = `<div class="card"><h2>Skills watch</h2>
   <p class="sub">What the postings in your search keep asking for, most asked first, and where you stand on each. ${head}</p>
   <p class="hint"><b>Skilled</b>: your evidence bank backs it with real examples. <b>Partial gap</b>: some examples, not the full ask. <b>Gap</b>: no example yet. A gap high on the list is where to collect more examples or build more experience.</p>
   <div class="seg" role="group" aria-label="Which skills to show" style="width:max-content;margin:8px 0 12px"><button id="sk-all" class="${SKILLS_GAPS_ONLY?"":"on"}">All skills</button><button id="sk-gaps" class="${SKILLS_GAPS_ONLY?"on":""}">Gaps and partial gaps</button></div>
   <div class="scroll"><table><thead><tr><th>Rank</th><th>Skill</th><th>Status</th><th>Share of postings</th><th>Change (points)</th><th>Rank change</th><th>In your ${L ? L.applications_total : 0} saved postings</th><th>Closest evidence</th></tr></thead><tbody>
   ${shown.map(r=>`<tr><td>${r.rank}</td><td class="role">${esc(r.name)}</td><td>${pill(r.status)}</td><td>${Math.round(r.share*100)}% <span class="muted">(${r.postings})</span></td><td>${chg(r.share_change,true)}</td><td>${chg(r.rank_change,false)}</td><td>${r.applications ?? ""}</td><td>${esc(r.evidence)}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">Nothing to show yet.</td></tr>`}
   ${waiting.map(s=>`<tr><td class="muted">–</td><td class="role">${esc(s.name)}</td><td>${pill(s.status)}</td><td colspan="5" class="muted">Counted on the next morning run.</td></tr>`).join("")}
   </tbody></table></div></div>
   <div class="card"><h2>Your skills list</h2>
   <p class="sub">${v.source === "evidence bank" ? "These start from your evidence bank's keyword groups. Change anything and save to make the list your own." : v.source === "none" ? "Add the skills your target roles ask for." : "Change a status when you gain an example: your bank backs it, or you've built the experience."}
   Keywords are the words postings use for the skill, separated by commas. A posting counts when it uses any of them. A keyword that starts with ~ is an advanced pattern.</p>
   <div class="scroll"><table><thead><tr><th>Skill</th><th>Keywords</th><th>Status</th><th>Closest evidence</th><th>In ranking</th><th></th></tr></thead><tbody>
   ${v.skills.map((r,i)=>`<tr><td><input type="text" aria-label="Skill name" data-i="${i}" data-k="name" value="${esc(r.name)}"></td>
     <td><input type="text" aria-label="Keywords for ${esc(r.name)}" data-i="${i}" data-k="keywords" value="${esc(r.keywords.join(", "))}"></td>
     <td><select aria-label="Status for ${esc(r.name)}" data-i="${i}" data-k="status">${v.statuses.map(s=>`<option ${s===r.status?"selected":""}>${s}</option>`).join("")}</select></td>
     <td><input type="text" aria-label="Closest evidence for ${esc(r.name)}" data-i="${i}" data-k="evidence" value="${esc(r.evidence)}"></td>
     <td><input type="checkbox" aria-label="Show ${esc(r.name)} in the ranking" data-i="${i}" data-k="track" ${r.track?"checked":""}></td>
     <td><button data-del="${i}">Remove</button></td></tr>`).join("")}</tbody></table></div>
   <p><button id="adds">Add a skill</button> <button class="primary" id="saves">Save</button> <span id="smsg" class="ok" role="status"></span></p></div>`;
  const read = () => v.skills.map((r,i)=>{ const g = k => el.querySelector(`[data-i="${i}"][data-k="${k}"]`);
    return {name: g("name")?.value || "", keywords: (g("keywords")?.value || "").split(",").map(x=>x.trim()).filter(Boolean),
            status: g("status")?.value || "Gap", evidence: g("evidence")?.value || "", track: !!g("track")?.checked}; });
  const save = async (list, msg) => { const r = await api("/api/skills", {skills: list}); const m = $("#smsg");
    if (r.ok) { if (msg) { await renderSkills(); $("#smsg").textContent = msg; } } else { m.className = "err"; m.textContent = r.error; } return r.ok; };
  $("#sk-all").onclick = () => { SKILLS_GAPS_ONLY = false; renderSkills(); };
  $("#sk-gaps").onclick = () => { SKILLS_GAPS_ONLY = true; renderSkills(); };
  $("#adds").onclick = () => { v.skills = read(); v.skills.push({name:"",keywords:[],status:"Gap",evidence:"",track:true}); const keep = v; renderSkillsList(keep); };
  $("#saves").onclick = () => save(read(), "Saved. The ranking updates on the next morning run.");
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const cur = read(); cur.splice(Number(b.dataset.del),1); save(cur, "Removed."); });
  function renderSkillsList(keep) { const tb = el.querySelectorAll("table")[1].querySelector("tbody"); const i = keep.skills.length - 1;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input type="text" aria-label="Skill name" data-i="${i}" data-k="name" value=""></td><td><input type="text" aria-label="Keywords" data-i="${i}" data-k="keywords" value=""></td>
      <td><select aria-label="Status" data-i="${i}" data-k="status">${keep.statuses.map(s=>`<option ${s==="Gap"?"selected":""}>${s}</option>`).join("")}</select></td>
      <td><input type="text" aria-label="Closest evidence" data-i="${i}" data-k="evidence" value=""></td><td><input type="checkbox" aria-label="Show in the ranking" data-i="${i}" data-k="track" checked></td><td></td>`;
    tb.appendChild(tr); tr.querySelector("input").focus(); }
}

const ADV = {"agent.FRESH_DAYS":"Days a posting counts as fresh","agent.FRESH_ALERT_DAYS":"How new a top posting must be to alert you (days)",
 "agent.EVERGREEN_AGE_DAYS":"Days open before a posting is flagged as likely evergreen","agent.AGE_NOTE_DAYS":"Days open before a posting gets an age note","agent.REPOST_WINDOW_DAYS":"How far back to catch reposts (days)",
 "agent.GHOST_FLAG_IDS":"Reposts under new IDs before a posting is flagged","agent.GHOST_FLAG_LOCATIONS":"Locations for one role before it's flagged","agent.GHOST_SKIP_IDS":"Reposts before it's skipped"};
async function renderAdvanced() {
  const v = await api("/api/advanced"); const el = $("#advanced");
  el.innerHTML = `<div class="card"><h2>Advanced</h2><p class="sub">Most people never change these. The defaults work well.</p>
   ${Object.entries(ADV).map(([k,l])=>`<label for="${k}">${l}</label><input id="${k}" type="number" min="0" value="${esc(v[k])}">`).join("")}
   <p><button class="primary" id="savea">Save</button> <span id="advmsg" class="ok"></span></p></div>`;
  $("#savea").onclick = async () => { const out = Object.fromEntries(Object.keys(ADV).map(k=>[k, $("#"+CSS.escape(k)).value])); const r = await api("/api/advanced", out); $("#advmsg").textContent = r.ok ? "Saved." : r.error; };
}

const PRIVACY_HTML = `<div class="card"><h2>What stays here, what goes to Claude, and what you promise</h2>
   <p class="sub">Plain words, no legal language. Read it once before you start.</p>
   <h3>Stays on this computer</h3>
   <p>Your settings, your evidence bank, your resumes and cover letters, your applications, your contacts, and your tracker are plain files in the folder you choose. The daily job checks, the scoring, and the pre-send gate run here. The kit connects to no email account and no other account of yours.</p>
   <h3>Goes out</h3>
   <p>Requests to the job sites the kit reads and to the job boards of the companies you follow, including boards the kit finds for companies whose postings fit you (they see a request from this computer and the kit's name, nothing about you). Once a day, a check of this project's GitHub releases page for updates (GitHub sees your computer's internet address, nothing else); you can turn that off under My search profile, How it runs. When you use the Claude plugin, whatever you put in front of Claude: your evidence bank, the posting, the draft, your answers. That goes to Anthropic under your own Claude plan's terms. When you ask Claude to research a company, Claude searches the web for that company by name; nothing about you goes into the search. Nothing goes to the person who made this kit except an error report you choose to send, and that report holds error lines only.</p>
   <h3>What you promise</h3>
   <p>Every bullet on your resume is true, in your words, and you confirm each one before it goes on a page. The kit traces every bullet back to your evidence bank and refuses anything that isn't there, but you are the one who knows what's true. If an application asks whether AI helped write your materials, answer honestly: Claude helped you select and arrange your own evidence, and you reviewed every line.</p>
   <h3>This is a free beta</h3>
   <p>The kit is free, provided as is, with no guarantee that it works or that its scores and drafts are right. It can miss a posting, score one wrong, or draft a line you wouldn't say. You review and confirm everything before you send it, and you are responsible for every application, resume, letter, and message you send. The kit never sends anything for you.</p>
   <h3>If you change your mind</h3>
   <p>The kit keeps a daily backup of your tracker, contacts, evidence bank, and settings for 14 days, on this computer only (in the data folder, under backups). Logs are kept about 30 days. Copy the folder to keep your own copy. To remove your data, use Delete your data on the Privacy page. Uninstalling the app leaves the folder alone.</p>
   <p><label><input type="checkbox" id="privok"> I've read this. I understand the kit is a free beta, provided as is, and that I review and send everything myself.</label> <span id="privmsg"></span></p></div>`;
const DELETE_HTML = `<div class="card"><h2>Delete your data</h2>
   <p class="sub">This can't be undone, and it removes the daily backups too. Copy your folder first if you might want anything back.</p>
   <div class="choice">
    <label><input type="radio" name="delscope" value="records" checked> Tracker, contacts, backups, and logs only<br><small>Keeps your evidence bank, applications, and settings.</small></label>
    <label><input type="radio" name="delscope" value="everything"> Everything the kit made<br><small>Also your evidence bank, applications, resumes, settings, and the daily schedule. Files you added yourself stay.</small></label>
   </div>
   <label for="delconfirm">Type <b>delete my data</b> to confirm</label><input id="delconfirm" type="text" autocomplete="off">
   <p><button id="delgo">Delete</button> <span id="delmsg"></span></p></div>`;
function renderPrivacy(next) {
  const el = next ? $("#setup") : $("#privacy"); el.innerHTML = PRIVACY_HTML;
  if (!next) el.insertAdjacentHTML("beforeend", DELETE_HTML);
  const box = $("#privok"); if (!next) { try { box.checked = localStorage.getItem("privacy_ok") === "1"; } catch (e) {} }
  if (!next) $("#delgo").onclick = async () => {
    const scope = document.querySelector("input[name=delscope]:checked").value;
    const r = await api("/api/delete_data", {scope, confirm: $("#delconfirm").value});
    if (!r.ok) { $("#delmsg").textContent = r.error || "Couldn't delete."; $("#delmsg").className = "err"; return; }
    $("#delmsg").className = "ok";
    $("#delmsg").textContent = scope === "everything"
      ? (r.folder_left ? "Deleted. Files you added yourself are still in the folder. You can uninstall the app in Windows Settings, Apps." : "Deleted. You can uninstall the app in Windows Settings, Apps.")
      : "Your tracker, contacts, backups, and logs are deleted. Your evidence bank and applications are still there.";
  };
  box.onchange = async () => { try { localStorage.setItem("privacy_ok", box.checked ? "1" : "0"); } catch (e) {}
    if (box.checked) { const r = await api("/api/acknowledge", {}); if (r && r.ok === false && !r.later) { $("#privmsg").textContent = "Couldn't save that; try again."; return; } }
    if (box.checked && next) next(); };
}
function privacyRead() { try { return localStorage.getItem("privacy_ok") === "1"; } catch (e) { return true; } }
async function renderFolder() {
  const f = await api("/api/folder"); const el = $("#setup");
  el.innerHTML = `<div class="card"><h2>Where should your Job Search folder live?</h2>
   <p class="sub">This folder will hold your settings, your evidence bank, your applications, and your tracker. Everything stays on this computer either way.</p>
   ${f.documents_synced ? `<div class="note banner">Your Documents folder is backed up to a cloud service (OneDrive or similar). That means your resumes and evidence bank would be copied there too. Pick what you prefer.</div>` : ""}
   <div class="choice">
    <label><input type="radio" name="fold" value="documents" ${f.documents_synced ? "" : "checked"}> ${esc(f.documents.label)}<br><small>${esc(f.documents.path)}</small></label>
    <label><input type="radio" name="fold" value="local" ${f.documents_synced ? "checked" : ""}> ${esc(f.local.label)}<br><small>${esc(f.local.path)}</small></label>
   </div>
   <p><button class="primary" id="foldok">Create the folder</button> <span id="foldmsg"></span></p></div>`;
  $("#foldok").onclick = async () => { $("#foldmsg").textContent = "Creating..."; const choice = document.querySelector("input[name=fold]:checked").value;
    const r = await api("/api/folder", {choice, acknowledged: privacyRead()}); if (r.ok) { A = null; route(); } else $("#foldmsg").textContent = r.error || "Couldn't create the folder."; };
}

async function route() {
  let page = (location.hash || "#tracker").slice(1);
  const anchor = page === "suggest" ? "suggest" : "";
  if (anchor) page = "help";
  const PAGES = ["setup","tracker","health","companies","skills","profile","contacts","advanced","privacy","help"];
  if (!PAGES.includes(page)) page = "tracker";
  closeDrawer();
  ST = await api("/api/status");
  UI = {theme: ST.theme, status_colors: ST.status_colors || {}};
  applyTheme(ST.theme); store.set("kit-theme", ST.theme); store.set("kit-colors", UI.status_colors);
  if (page !== "setup" && page !== "privacy" && page !== "help" && (ST.needs_folder || ST.needs_ack || !ST.configured)) page = "setup";
  PAGES.forEach(p => { $("#"+p).hidden = p !== page; const n = $("#n-"+p); if (n) n.classList.toggle("on", p === page && !anchor); });
  $("#n-suggest").classList.toggle("on", !!anchor);
  $("main").classList.toggle("narrow", !["tracker","health","companies","skills"].includes(page));
  if (page==="setup") { if (ST.needs_folder) { if (!privacyRead()) { renderPrivacy(route); return; } renderFolder(); return; }
    if (ST.needs_ack) { renderPrivacy(route); return; } if (!A) A = await api("/api/answers"); renderSetup(); }
  if (page==="privacy") renderPrivacy();
  if (page==="tracker") renderTracker();
  if (page==="health") renderHealth();
  if (page==="companies") renderCompanies();
  if (page==="profile") renderProfile();
  if (page==="skills") renderSkills();
  if (page==="contacts") renderContacts();
  if (page==="advanced") renderAdvanced();
  if (page==="help") { renderHelp(); if (anchor) $("#suggest").scrollIntoView(); else window.scrollTo(0,0); }
}
window.addEventListener("hashchange", route); route();
</script>
</body>
</html>
